name: Release

# 推 v* 标签即构建三平台产物并发布 GitHub Release。
# workflow_dispatch（手动）只产出 workflow artifacts，方便先验证流水线再打 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      # 一个平台失败不要拖掉另外两个：三方源码 + FFmpeg 首次编译几十分钟，
      # 全量重跑代价很高
      fail-fast: false
      matrix:
        config:
          # Windows 现代平台（Win7/10/11 x64）：Qt 5.15.2 + MinGW 8.1 64 位，FFmpeg 6.1.2。
          # 新驱动不再回答 NVENC API 8.0 的「预设 GUID」接口，3.4.8 在这类机器上
          # avcodec_open2 直接返回 -40，4.1 起的 p1–p7 词表才可用。
          # tools: tools_mingw —— install-qt-action 装 mingw 架构的 Qt 时并不会顺带装编译器，
          # 必须显式要，否则 cmake 只能找到 runner 的 MSVC（而三方源码只支持 GNU make/GCC）。
          - name: Windows x64
            key: windows-x64
            os: windows-2022
            qt_official: 'true'
            qt: '5.15.2'
            qt_host: windows
            qt_target: desktop
            qt_arch: win64_mingw81
            qt_tools: 'tools_mingw'
            ffmpeg: '6.1.2'
            # FFmpeg >= 5 源码树里没有 compat/nvenc，必须外部 nv-codec-headers
            nvcodec: 'n12.2.72.0'
            artifact: QtRemoteDesktop-windows-x64.zip
          # Windows XP（32 位兼容产物）：Qt 5.7 是最后一个官方支持 XP 的版本；MSVC 运行库
          # 在 XP 上装不上，所以用 MinGW 5.3 32 位（产物无 VC 运行时依赖）。
          # Qt 5.7 在线仓库已下架、aqtinstall 不支持 5.9 以下，因此从离线安装包解包。
          # 这是全仓库唯一固定 FFmpeg 3.4.8 的构建（XP 兼容）。Win7 32 位不在本腿：
          # 它和其他平台一样用 6.1.2，可复用同一 Qt 5.7 工具链并显式传
          # -DFFMPEG_VERSION=6.1.2（本地对应 build_win7_612）。
          # FFmpeg 固定 3.4.8：mingw530 是 32 位而 NVIDIA 不提供 32 位 CUDA，
          # 这里硬编本来就用不上，升版本只会逼着全部三方产物重编。
          - name: Windows XP x86
            key: windows-xp
            os: windows-2022
            qt_official: 'false'
            qt: '5.7.1'
            qt_host: windows
            qt_target: desktop
            qt_arch: win32_mingw53
            qt_tools: ''
            ffmpeg: '3.4.8'
            nvcodec: ''
            artifact: QtRemoteDesktop-windows-xp.zip
          # Linux x86_64：ubuntu-22.04（较旧的 glibc，产物能回到更老的发行版）。
          # 直接复用仓库内的 build_linux.sh —— 它的依赖检查、NVENC/VAAPI 探测和
          # FFmpeg/openh264 构建顺序都在本机验证过，比在这里重写一遍 cmake 更可信。
          # macOS 不在本矩阵里，由下面独立的 build-macos job 构建：矩阵里每一步都按
          # Windows/Linux 条件化（NASM、apt、windeployqt、patchelf），macOS 一步都复用不了。
          - name: Linux x86_64
            key: linux-x86_64
            os: ubuntu-22.04
            qt_official: 'true'
            qt: '5.15.2'
            qt_host: linux
            qt_target: desktop
            qt_arch: gcc_64
            qt_tools: ''
            ffmpeg: '6.1.2'
            nvcodec: 'n12.2.72.0'
            artifact: QtRemoteDesktop-linux-x86_64.tar.gz

    env:
      # 矩阵值不直接写进 run 块（GitHub 先做字符串替换，带空格的值会把命令行拆碎），
      # 统一经环境变量交给脚本
      QT_VERSION: ${{ matrix.config.qt }}
      QT_ARCH: ${{ matrix.config.qt_arch }}
      FFMPEG_VER: ${{ matrix.config.ffmpeg }}
      NVCODEC_TAG: ${{ matrix.config.nvcodec }}
      ARTIFACT_NAME: ${{ matrix.config.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- NASM（两个 Windows job 都要）----------
      # openh264 的 Makefile 直接调 nasm 编 x86 汇编，缺了 Build 阶段直接失败；
      # FFmpeg 侧缺 nasm 只会静默关掉 swscale 汇编（约慢 3 倍），也不能缺
      - name: Install NASM (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Locate-Nasm {
            $cmd = Get-Command nasm.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($d in 'C:\Program Files\NASM', 'C:\Program Files (x86)\NASM', 'C:\tools\nasm') {
              $f = Join-Path $d 'nasm.exe'
              if (Test-Path $f) { return $f }
            }
            return $null
          }

          # nasm 是 openh264 Makefile 直接调用的外部命令，也是 FFmpeg x86 汇编的前提，
          # 拿不到就没有可发布的产物，所以依次试三条路，任一打通即停。
          # 只做单次 choco 是不够的：v1.2.1 两个 Windows job 在同一提交上都比两小时前
          # 那轮晚 2 小时跑，双双停在「nasm 未安装成功」，而那次改的只有 macOS 分支 ——
          # 说明是 Chocolatey 源侧抖动，必须留一条不经它的直装路径。
          $nasm = Locate-Nasm
          if ($nasm) { Write-Host "runner 已有 nasm：$nasm" }

          # runner 镜像 2026 年年中起自带 NASM 3.02。nasm 3 展开 FFmpeg 3.4.8 的
          # x86inc.asm 时，simple_idct10.asm 的例程会被整个丢掉，产出的 .o 一个节都没有，
          # 打到 libavcodec.a 时 strip 报 "the input file ... has no sections"
          # （v1.2.7 的 XP 腿，同一份代码两小时前的 v1.2.6 还是绿的）。
          # FFmpeg 5 起才修掉与 nasm 3 的兼容问题，所以只对 3.4.8 这条腿拒收 3.x；
          # x64 腿用的是 6.1.2，nasm 3 已经验证过，不跟着改。
          # choco 的 nasm 包如今也是 3.x，所以认出 3.x 就跳过前两条路，直装钉死的 2.16.03；
          # GITHUB_PATH 写进去的目录排在 PATH 最前，会盖住 C:\Program Files\NASM。
          $needPinned = $false
          if ($nasm -and ('${{ matrix.config.ffmpeg }}' -like '3.*')) {
            $verLine = ((& $nasm -v) | Select-Object -First 1)
            if ($verLine -match 'NASM version\s+(\d+)') {
              if ([int]$Matches[1] -ge 3) {
                Write-Host "FFmpeg 3.4.8 腿遇到 $verLine，nasm 3 编不了它的汇编，改装 2.16.03"
                $nasm = $null
                $needPinned = $true
              }
            } else {
              Write-Host "nasm -v 输出解析不了（$verLine），先按可用处理"
            }
          }

          if (-not $nasm -and -not $needPinned) {
            Write-Host '=== choco install nasm ==='
            choco install nasm -y --no-progress
            $nasm = Locate-Nasm
          }

          if (-not $nasm) {
            Write-Host '=== 直装 nasm.us 官方 zip ==='
            $zip = Join-Path $env:RUNNER_TEMP 'nasm.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'nasm-dist'
            $url = 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
            for ($i = 1; $i -le 3 -and -not $nasm; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
                Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
                Expand-Archive -Path $zip -DestinationPath $dir -Force
                $hit = Get-ChildItem $dir -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue |
                       Select-Object -First 1
                if ($hit) { $nasm = $hit.FullName }
              } catch {
                Write-Host "第 $i 次取包失败：$($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $i)
              }
            }
          }

          if (-not $nasm) {
            Write-Host '::error::nasm 三条途径都没拿到（runner 自带 / choco / nasm.us）'
            exit 1
          }
          Split-Path $nasm -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nasm -v
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::nasm -v 执行失败'; exit 1 }

      # ---------- Qt（在线仓库覆盖得到的版本）----------
      # aqt 从 Qt 官方镜像取包，偶发 HTTP 错误（v1.2.3 的 Linux 腿就是这条：
      # 同一份输入 20 分钟前刚成功过）。这里失败不让整个矩阵腿陪葬，
      # 原地重试一次；真的连续两次都失败才判死。
      - name: Install Qt
        id: qt_official
        if: matrix.config.qt_official == 'true'
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.config.qt }}
          host: ${{ matrix.config.qt_host }}
          target: ${{ matrix.config.qt_target }}
          arch: ${{ matrix.config.qt_arch }}
          tools: ${{ matrix.config.qt_tools }}
          # 关掉 action 自带的 Qt 缓存：它按输入做 key，出现过恢复出旧版本 Qt 导致链接错乱；
          # Qt 本体解压只有几十秒，不值得冒这个风险
          cache: false

      - name: Retry Install Qt
        if: steps.qt_official.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.config.qt }}
          host: ${{ matrix.config.qt_host }}
          target: ${{ matrix.config.qt_target }}
          arch: ${{ matrix.config.qt_arch }}
          tools: ${{ matrix.config.qt_tools }}
          cache: false

      # ---------- Qt 5.7.1 + MinGW 5.3（XP 目标，只能走离线安装包）----------
      - name: Restore Qt 5.7 cache
        if: matrix.config.qt_official == 'false'
        uses: actions/cache@v4
        with:
          path: D:/qt571
          key: qt571-win32-mingw53-v1

      # 离线 exe 是 7-Zip 三层结构：exe → [0] 流（安装器容器）→ 编号 7z 组件载荷。
      # 只抽取含 mingw53 的组件（Qt 库 + MinGW 工具链），跳过文档/示例。
      - name: Setup Qt 5.7 + MinGW 5.3 (Windows XP)
        if: matrix.config.qt_official == 'false'
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p /d/qt571 && cd /d/qt571
            QMAKE=$(find /d/qt571 -type f -name qmake.exe 2>/dev/null | head -1)
            if [ -z "$QMAKE" ]; then
              echo "=== cache miss: downloading offline installer ==="
              curl -sSfL --retry 3 -o qt571.exe \
                "https://download.qt.io/archive/qt/5.7/5.7.1/qt-opensource-windows-x86-mingw530-5.7.1.exe"
              ls -la qt571.exe
              mkdir -p stage && cd stage
              echo "=== layer 1: extract [0] payload container from exe ==="
              7z x -y "../qt571.exe" -t'*' -i'![0]' > /dev/null
              echo "=== layer 2: split numbered component archives ==="
              7z x -y "[0]" -t'#' -i'!*.7z' > /dev/null
              echo "=== layer 3: extract components containing mingw53 ==="
              for f in [0-9]*.7z; do
                if 7z l "$f" 2>/dev/null | grep -q "mingw53"; then
                  echo "HIT: $f"
                  7z x -y -o/d/qt571 "$f" | tail -1
                else
                  echo "skip: $f"
                fi
              done
            fi
            QTBIN=$(find /d/qt571 -type f -name qmake.exe | head -1 | xargs dirname)
            GCCBIN=$(find /d/qt571 -type f -name "g++.exe" | head -1 | xargs dirname)
            echo "QTBIN=$QTBIN"
            echo "GCCBIN=$GCCBIN"
            { [ -n "$QTBIN" ] && [ -n "$GCCBIN" ]; } || { echo "::error::Qt5.7/mingw530 未解包成功"; exit 1; }

            # 解包出来的 qmake/windeployqt 仍带着构建机路径 (c:/Users/qt/work/install)，
            # 用 qt.conf 把前缀指回解包目录
            printf '[Paths]\nPrefix=..\n' > "$QTBIN/qt.conf"
            # cc1plus 等子程序在 libexec 目录，运行时按「程序目录 → PATH」找 DLL；
            # PATH 上 Git 自带的 64 位同名 DLL 会让 32 位 cc1plus 起不来，
            # 且这种加载失败在 Windows 上没有任何 stderr（只留一个非零退出码），
            # 所以既把运行库复制进子程序目录，也把 32 位工具链放到 PATH 最前面
            for d in "$GCCBIN/../libexec/gcc/i686-w64-mingw32/5.3.0" \
                     "$GCCBIN/../lib/gcc/i686-w64-mingw32/5.3.0"; do
              for f in libwinpthread-1.dll libstdc++-6.dll libgcc_s_dw2-1.dll; do
                cp "$GCCBIN/$f" "$d/$f" 2>/dev/null && echo "seeded $d/$f"
              done
            done
            export PATH="$GCCBIN:$PATH"
            # 后续 cmake 步骤用绝对路径调编译器，但 cc1plus 仍靠 PATH 找 DLL
            echo "$(cygpath -w "$GCCBIN")" >> "$GITHUB_PATH"

            # QT_ROOT_DIR 与 install-qt-action 的变量名对齐，Windows 两个 job 后续的
            # configure/deploy 步骤因此完全共用
            echo "QT_ROOT_DIR=$(cygpath -w "$QTBIN/..")" >> "$GITHUB_ENV"
            echo "MINGW_BIN=$(cygpath -w "$GCCBIN")" >> "$GITHUB_ENV"
            echo "=== toolchain check ==="
            "$GCCBIN/gcc.exe" -v 2>&1 | head -3
            "$QTBIN/qmake.exe" -query QT_INSTALL_PREFIX
            "$QTBIN/qmake.exe" -query QT_VERSION
            echo 'int main(){return 0;}' > smoke.cxx
            "$GCCBIN/g++.exe" -m32 smoke.cxx -o smoke.exe \
              || { echo "::error::mingw530 g++ 编译冒烟失败"; exit 1; }
            ./smoke.exe \
              || { echo "::error::mingw530 生成的 exe 无法运行（缺 32 位运行库？）"; exit 1; }
            echo "COMPILE_OK"
          } 2>&1 | tee setup_qt.log

      # ---------- 定位 MinGW 编译器 ----------
      # tools_mingw 的具体变体名随 Qt 上游仓库变化（mingw810_64 / mingw1310_64 …），
      # 所以这里按位宽扫目录而不是硬编码路径；找不到就直接失败并报清楚，
      # 不能让 cmake 悄悄退回 runner 的 MSVC（三方源码编不过，错误会在几十分钟后才爆）。
      - name: Locate MinGW
        if: matrix.config.qt_official == 'true' && startsWith(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bits = if ($env:QT_ARCH -like 'win64*') { '64' } else { '32' }
          $roots = @($env:IQTA_TOOLS, (Join-Path (Split-Path $env:QT_ROOT_DIR -Parent) 'Tools')) |
                   Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $gpp = $null
          foreach ($r in $roots) {
            $cand = Get-ChildItem $r -Directory -Filter "mingw*_$bits" -ErrorAction SilentlyContinue |
                    ForEach-Object { Join-Path $_.FullName 'bin\g++.exe' } |
                    Where-Object { Test-Path $_ } | Sort-Object | Select-Object -Last 1
            if ($cand) { $gpp = $cand; break }
          }
          if (-not $gpp) {
            $onPath = Get-Command g++.exe -ErrorAction SilentlyContinue
            if ($onPath) {
              $gpp = $onPath.Source
              Write-Warning "IQTA_TOOLS 下没有 mingw$bits，退回 PATH 里的 $gpp（与 Qt 的编译器版本可能不一致）"
            }
          }
          if (-not $gpp) {
            Write-Host "::error::找不到 MinGW g++（QT_ARCH=$env:QT_ARCH, IQTA_TOOLS=$env:IQTA_TOOLS）"
            exit 1
          }
          $mingwBin = Split-Path $gpp -Parent
          Write-Host "g++: $gpp"
          & $gpp -v 2>&1 | Select-Object -Last 1
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Qt WebSockets 缺失会在链接阶段才报 -lQt5WebSockets not found，
          # 这里提前判：需要时给 install-qt-action 加 modules: 'qtwebsockets'
          if (-not (Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter 'Qt*WebSockets*' -ErrorAction SilentlyContinue)) {
            Write-Host "::error::Qt WebSockets 模块缺失：给 Install Qt 步骤加 modules: 'qtwebsockets'"
            exit 1
          }

      # ---------- 三方源码（仓库里被 .gitignore 排除，CI 现场下载）----------
      - name: Fetch FFmpeg + nv-codec-headers sources
        shell: bash
        run: |
          set -o pipefail
          # 下载/解包失败必须让整步失败：没有这行，mv 失败会被吞掉，
          # 构建要等到几十分钟后才在 cmake 里报找不到源码
          set -e
          {
            FFDIR=src/remotedesk/thridparty/ffmpeg
            mkdir -p "$FFDIR"
            # GitHub 归档包的根目录名取自 tag（n6.1.2 → FFmpeg-n6.1.2，而不是 FFmpeg-6.1.2），
            # 与目录约定 FFmpeg-n<版本> 对不上，所以解到临时目录后按实际目录名搬，不靠猜
            unpack_archive() {  # $1=tar 路径 $2=归一后的目标目录名 $3=归档内根目录前缀
              local tmp src
              tmp=$(mktemp -d)
              tar -xzf "$1" -C "$tmp"
              src=$(find "$tmp" -mindepth 1 -maxdepth 1 -name "$3*" | head -1)
              if [ -z "$src" ]; then
                echo "::error::归档 $(basename "$1") 里没有 $3* 目录"
                ls -la "$tmp"
                return 1
              fi
              rm -rf "$FFDIR/$2"
              mv "$src" "$FFDIR/$2"
              rm -rf "$tmp"
            }
            # 目录名必须符合 CMake/构建脚本的 FFmpeg-n<版本> 约定
            if [ ! -d "$FFDIR/FFmpeg-n$FFMPEG_VER" ]; then
              echo "=== downloading FFmpeg $FFMPEG_VER ==="
              curl -sSfL --retry 3 -o /tmp/ff.tar.gz \
                "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$FFMPEG_VER.tar.gz"
              unpack_archive /tmp/ff.tar.gz "FFmpeg-n$FFMPEG_VER" "FFmpeg-"
              # Git bash 在 Windows 文件系统上不一定保得住 tar 里的执行位，
              # 而 BuildFFmpeg.cmake 是把 configure 当命令直接执行的
              chmod +x "$FFDIR/FFmpeg-n$FFMPEG_VER/configure"
              ls -l "$FFDIR/FFmpeg-n$FFMPEG_VER/configure"
            fi
            # 3.4.8 自带 compat/nvenc，不需要外部头
            if [ -n "$NVCODEC_TAG" ] && [ ! -d "$FFDIR/nv-codec-headers-$NVCODEC_TAG" ]; then
              echo "=== downloading nv-codec-headers $NVCODEC_TAG ==="
              curl -sSfL --retry 3 -o /tmp/nv.tar.gz \
                "https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/$NVCODEC_TAG.tar.gz"
              unpack_archive /tmp/nv.tar.gz "nv-codec-headers-$NVCODEC_TAG" "nv-codec-headers-"
              ls "$FFDIR/nv-codec-headers-$NVCODEC_TAG/include/ffnvcodec"
            fi
            # Linux 的 metaRTC OpenSSL 兼容层要仓库内的 tarball
            # （third_party_src/openssl/CMakeLists.txt 缺失即 FATAL_ERROR，而 *.tar.gz 被忽略）
            OSSL=src/remotedesk/thridparty/third_party_src/openssl
            if [ "$RUNNER_OS" = "Linux" ] && [ ! -f "$OSSL/openssl-1.0.2u.tar.gz" ]; then
              echo "=== downloading OpenSSL 1.0.2u tarball ==="
              ok=""
              for u in \
                "https://github.com/openssl/openssl/releases/download/openssl-1.0.2u/openssl-1.0.2u.tar.gz" \
                "https://openssl-library.org/source/old/1.0.2/openssl-1.0.2u.tar.gz" \
                "https://www.openssl.org/source/openssl-1.0.2u.tar.gz"; do
                if curl -sfL --retry 2 -o "$OSSL/openssl-1.0.2u.tar.gz" "$u"; then ok="$u"; break; fi
              done
              [ -n "$ok" ] || { echo "::error::OpenSSL 1.0.2u tarball 下载失败"; exit 1; }
              echo "from $ok"
              sha256sum "$OSSL/openssl-1.0.2u.tar.gz"
            fi
          } 2>&1 | tee fetch_sources.log

      - name: Install Linux dependencies
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential cmake pkg-config yasm nasm autoconf libtool patchelf \
            libx11-dev libxext-dev libxi-dev libxtst-dev libxdamage-dev libxcomposite-dev \
            libxrender-dev libxfixes-dev libxrandr-dev libxcb-shm0-dev \
            libssl-dev zlib1g-dev libasound2-dev libpcap-dev libdrm-dev
          nasm -v

      # ---------- 构建 ----------
      # Windows 直接 cmake：生成器固定 MinGW Makefiles（三方源码要 GNU make），
      # 编译器/make 都用上一步定位到的 MinGW，避免混进 MSVC 或 MSYS2 的 GCC 13。
      - name: Configure (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: bash
        run: |
          set -o pipefail
          QT=$(cygpath -u "$QT_ROOT_DIR")
          MG=$(cygpath -u "$MINGW_BIN")
          # 资源编译器必须和编译器同一位宽：runner 的 PATH 上还有别的 windres，
          # CMake 猜错就会拿 32 位的编 main.rc，链接时报
          # "i386 architecture of input file main.rc.obj is incompatible with i386:x86-64"
          RC=""
          for c in "$MG/windres.exe" "$MG"/*-windres.exe; do
            if [ -f "$c" ]; then RC="$c"; break; fi
          done
          echo "RC compiler: ${RC:-<由 CMake 自动探测>}"
          rc_opt=()
          [ -z "$RC" ] || rc_opt=(-DCMAKE_RC_COMPILER="$RC")
          cmake -G "MinGW Makefiles" -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$MG/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MG/g++.exe" \
            "${rc_opt[@]}" \
            -DCMAKE_MAKE_PROGRAM="$MG/mingw32-make.exe" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DBUILD_THIRDPARTY=ON \
            -DFFMPEG_VERSION="$FFMPEG_VER" 2>&1 | tee configure.log
          echo "=== FFmpeg 版本 / 硬编探测 ==="
          grep -E "FFmpeg 版本|硬件编码器自动探测|x86asm|NVENC" configure.log || true

      - name: Build (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: bash
        run: |
          set -o pipefail
          # 首次构建要现编 FFmpeg + openh264 + metaRTC + srtp，几十分钟量级
          cmake --build build --parallel 3 2>&1 | tee build.log
          ls -la bin/QtRemoteDesktop.exe

      # Linux 调仓库自带脚本：依赖检查、硬编探测、FFmpeg 构建顺序都在本机验证过
      - name: Build (Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        shell: bash
        run: |
          set -o pipefail
          chmod +x src/linux_build_script/build_linux.sh
          FFMPEG_VERSION="$FFMPEG_VER" \
            ./src/linux_build_script/build_linux.sh -Q "$QT_ROOT_DIR" -j "$(nproc)" \
            2>&1 | tee build_linux.log
          echo "=== 硬编探测 ==="
          grep -E "NVENC|VAAPI|FFmpeg 版本|硬件" build_linux.log || true
          ls -la bin/QtRemoteDesktop

      # ---------- 部署 + 打包 ----------
      - name: Package (Windows)
        if: startsWith(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # windeployqt 负责 Qt DLL 与平台/图像插件；运行库自己拷，
          # 因为 MinGW 运行库按位宽换名（dw2 / seh），按工具链实际文件名取更稳。
          #
          # 不能给 64 位 job 加 --release：那里的插件 DLL 会被判成 debug，
          # --release 会把 platforms/imageformats 整组跳过（实测 Plugins: 为空，
          # 随后报 "Unable to find the platform plugin" 并以 1 退出）。
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations `
              --no-opengl-sw --no-compiler-runtime "bin\QtRemoteDesktop.exe" 2>&1 | Tee-Object deploy.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::windeployqt 失败"; exit 1 }
          # 32 位（Qt 5.7 + mingw530）产物被 windeployqt 判成 debug：它对 MinGW 只看
          # IMAGE_FILE_DEBUG_STRIPPED，而 5.3 的 binutils 不给无调试信息的 exe 置该位。
          # 于是部署出来的是 Qt5Cored.dll / qwindowsd.dll 这类调试库，可 exe 实际 import
          # 的是 release 名字。这里逐个换成 Qt 安装目录里的 release 文件（库在 bin，
          # 插件在 plugins\<组>），换不到的原样保留，交给下面的断言报错。
          if ($env:QT_ARCH -like 'win32*') {
            Get-ChildItem bin -Recurse -Filter '*d.dll' | ForEach-Object {
              $rel = $_.Name -replace 'd\.dll$', '.dll'
              $cand = Join-Path $env:QT_ROOT_DIR "bin\$rel"
              if (-not (Test-Path $cand)) {
                $sub = Split-Path $_.DirectoryName -Leaf
                $cand = Join-Path $env:QT_ROOT_DIR "plugins\$sub\$rel"
              }
              if (Test-Path $cand) {
                Copy-Item $cand (Join-Path $_.DirectoryName $rel) -Force
                Remove-Item $_.FullName -Force
                Write-Output "release 替换: $rel"
              }
            }
          }
          # 缺平台插件/JPEG 插件的包在目标机上起不来或图片模式不工作，直接判失败
          foreach ($req in @('platforms\qwindows.dll', 'imageformats\qjpeg.dll')) {
            if (-not (Test-Path (Join-Path 'bin' $req))) {
              Write-Host "::error::部署缺少 $req"; exit 1
            }
          }
          foreach ($pat in @('libgcc_s_*.dll', 'libstdc++-*.dll', 'libwinpthread-*.dll')) {
            Get-ChildItem $env:MINGW_BIN -Filter $pat -File -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName bin\ -Force; Write-Host "copied $($_.Name)" }
          }
          # 发布包不能 32/64 位混装：逐个校验 PE 机器类型（0x14c=x86, 0x8664=x64）
          $want = if ($env:QT_ARCH -like 'win64*') { 0x8664 } else { 0x14c }
          $bad = @()
          Get-ChildItem bin -Recurse -Include *.exe, *.dll | ForEach-Object {
            $fs = [IO.File]::OpenRead($_.FullName)
            try {
              # 用 FileStream 自己按偏移读：BinaryReader 不跟随 Position，
              # 混用会读到 DOS 头前几个字节，把所有文件误判成位宽不一致
              $hdr = New-Object byte[] 0x40
              $null = $fs.Read($hdr, 0, 0x40)
              $fs.Position = [BitConverter]::ToInt32($hdr, 0x3C) + 4
              $m = New-Object byte[] 2
              $null = $fs.Read($m, 0, 2)
              if ([BitConverter]::ToUInt16($m, 0) -ne $want) { $bad += $_.Name }
            } finally { $fs.Dispose() }
          }
          if ($bad.Count) { Write-Host "::error::PE 位宽不一致: $($bad -join ', ')"; exit 1 }
          # 部署结果必须真能启动：缺 Qt 库/平台插件时 --version 就会失败，
          # 别把坏包发出去（Windows 上加载失败没有 stderr，只能靠退出码）
          $out = & (Join-Path (Get-Location) 'bin\QtRemoteDesktop.exe') --version 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::部署后启动失败: $out"; exit 1 }
          Write-Host "VERSION: $out"
          Get-ChildItem bin | Select-Object Name, Length
          Compress-Archive -Path bin\* -DestinationPath $env:ARTIFACT_NAME -Force
          Get-Item $env:ARTIFACT_NAME | Select-Object Name, Length

      - name: Package (Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        shell: bash
        run: |
          set -o pipefail
          {
            DIST=dist
            rm -rf "$DIST" && mkdir -p "$DIST/lib"
            cp bin/QtRemoteDesktop "$DIST/"
            # 插件按 Qt 标准布局放在可执行文件同级（main.cpp 的 ensureQtPluginPath
            # 也会按 argv[0] 目录再兜一次）
            for g in platforms imageformats platforminputcontexts xcbglintegrations styles; do
              [ -d "$QT_ROOT_DIR/plugins/$g" ] && cp -a "$QT_ROOT_DIR/plugins/$g" "$DIST/" || true
            done
            # BFS 只收 $QT_ROOT_DIR/lib 下的 Qt .so：glibc/libxcb 之类系统库留在目标机，
            # 打进包反而会和宿主 ABI 冲突
            # ldd 对插件给出的路径带 $ORIGIN 展开后的 ..（…/plugins/platforms/../../lib/x），
            # 必须先 realpath 归一，否则前缀匹配整批漏掉（Qt5XcbQpa/Qml/Svg… 收不进包）
            qtlibs() {
              # 必须返回 0：GitHub Actions 的 bash 带 -e，最后一个库没有 Qt 依赖时
              # grep 返回 1，整个打包步骤会在这里无声退出（日志文件一行都没有）
              ldd "$@" 2>/dev/null | awk '/=>/ {print $3}' | while read -r p; do
                [ -e "$p" ] && realpath -e "$p" || true
              done | grep -F "$QT_ROOT_DIR/lib/" || true
            }
            # 按 SONAME 落地：ldd 给的是真实文件（libQt5Core.so.5.15.2），加载器只认
            # SONAME（libQt5Core.so.5），两个名字都得是实体文件
            copy_qt_lib() {
              local src="$1" base soname
              base=$(basename "$src")
              cp -Lf "$src" "$DIST/lib/$base"
              soname=$(readelf -d "$src" | awk -F'[][]' '/SONAME/{print $2}')
              if [ -n "$soname" ] && [ "$soname" != "$base" ]; then
                cp -Lf "$src" "$DIST/lib/$soname"
              fi
              return 0
            }
            seen=""
            # 从原始 Qt 安装位置出发：刚拷进 $DIST 的插件还没有 RUNPATH，
            # 对它们做 ldd 会落到宿主 Qt 上，BFS 会提前断链漏库
            queue=$({ qtlibs "$DIST/QtRemoteDesktop"
                      qtlibs "$QT_ROOT_DIR"/plugins/{platforms,imageformats,platforminputcontexts,xcbglintegrations,styles}/*.so
                    } | sort -u)
            while [ -n "$queue" ]; do
              next=""
              for f in $queue; do
                case "$seen" in *" $f "*) continue ;; esac
                [ -f "$f" ] || continue
                copy_qt_lib "$f" || true
                seen="$seen $f "
                next="$next $(qtlibs "$f")"
              done
              queue="$next"
            done
            # 运行时搜索路径：exe → $ORIGIN/lib，lib/* → $ORIGIN，插件 → $ORIGIN/../lib
            patchelf --set-rpath '$ORIGIN/lib' "$DIST/QtRemoteDesktop"
            for f in "$DIST"/lib/*; do patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true; done
            for d in "$DIST"/platforms "$DIST"/imageformats "$DIST"/platforminputcontexts "$DIST"/xcbglintegrations "$DIST"/styles; do
              [ -d "$d" ] || continue
              for f in "$d"/*.so; do patchelf --set-rpath '$ORIGIN/../lib' "$f" 2>/dev/null || true; done
            done
            echo "=== staged ==="
            du -sh "$DIST"; ls "$DIST"; ls "$DIST/lib" | head -40 || true
            miss=$(LD_LIBRARY_PATH= ldd "$DIST/QtRemoteDesktop" | grep 'not found' || true)
            echo "=== 未解析依赖: ${miss:-none} ==="
            [ -z "$miss" ] || { echo "::error::打包后仍有未解析依赖"; exit 1; }
            # ldd 会顺着系统 Qt 找到库，断链也能「解析成功」，必须单独确认
            # Qt 相关依赖全部落在 $DIST/lib 里，否则包里跑起来实际用的是宿主 Qt。
            # 必须清掉 LD_LIBRARY_PATH：install-qt-action 把它设成了宿主 Qt 的 lib，
            # 不清的话这里永远只能解析到宿主 Qt（误报），冒烟测试也没测到打包内容
            escape=$(LD_LIBRARY_PATH= ldd "$DIST/QtRemoteDesktop" "$DIST"/imageformats/*.so "$DIST"/platforms/*.so 2>/dev/null \
                     | awk '/Qt[56]/ {print $1, $3}' | grep -v "$DIST" | sort -u || true)
            echo "=== 落到宿主 Qt 的依赖: ${escape:-none} ==="
            [ -z "$escape" ] || { echo "::error::打包缺 Qt 库，运行时会回落到宿主 Qt"; exit 1; }
            # 冒烟：offscreen 平台跑 --version，证明 Qt 运行库 + 平台插件真能被加载
            # 先关 -e 再取 PIPESTATUS，否则失败时直接退出，来不及给出 error 标注
            set +e
            LD_LIBRARY_PATH= QT_QPA_PLATFORM=offscreen QT_PLUGIN_PATH="$DIST" \
              "$DIST/QtRemoteDesktop" --version 2>&1 | tee smoke.log
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" -eq 0 ] || { echo "::error::打包后冒烟启动失败 (rc=$rc)"; exit 1; }
            # 冒烟会留下运行期文件，别打进发布包
            rm -rf "$DIST/logs" "$DIST/server_config.json"
            tar -czf "$ARTIFACT_NAME" -C dist .
            ls -la "$ARTIFACT_NAME"
          } 2>&1 | tee package.log

      - name: Verify artifact exists
        shell: bash
        run: |
          test -f "$ARTIFACT_NAME" || { echo "::error::产物缺失: $ARTIFACT_NAME"; exit 1; }
          ls -la "$ARTIFACT_NAME"

      # 调试：失败时把日志推到 logs-<key> 分支（公开仓库网页上直接可读），
      # 否则只能在一屏就被截断的 Actions 输出里猜哪一步错了
      - name: Dump logs to logs branch
        if: failure()
        shell: bash
        run: |
          set +e
          BR="logs-${{ matrix.config.key }}"
          git config user.email "ci@remotedesk.local"
          git config user.name "remotedesk-ci"
          git fetch origin "$BR" 2>/dev/null || true
          git checkout -B "$BR" "origin/$BR" 2>/dev/null || git checkout -B "$BR"
          mkdir -p ci-logs
          {
            echo "=== pwd: $(pwd)"
            for f in setup_qt.log fetch_sources.log configure.log build.log build_linux.log deploy.log package.log smoke.log; do
              echo "=== $f ==="
              cat "$f" 2>/dev/null || echo "(不存在)"
            done
            echo "=== 错误摘要 ==="
            grep -inE "error|undefined reference|cannot find|No such file|fatal" \
              build.log build_linux.log configure.log 2>/dev/null | tail -80
          } > ci-logs/all.log
          # .gitignore 里有 *.txt / build*/，必须 -f 才加得进来
          git add -f ci-logs/all.log
          git commit -m "ci logs: ${{ matrix.config.name }} run ${{ github.run_id }} $(date -u +%Y%m%d%H%M%S)" || true
          git push --force origin "$BR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.key }}
          path: ${{ matrix.config.artifact }}
          if-no-files-found: error

  # ==========================================================================
  # macOS（x86_64 + arm64 两条腿）
  # ==========================================================================
  # Qt 5.15 的官方在线安装包在 macOS 上只有 x86_64，所以 Intel 腿走 aqt。arm64 腿
  # 只能用 Homebrew 的 qt@5：它的源就是官方 qt-everywhere-opensource-src-5.15.19 整包，
  # configure 只 -skip qtwebengine（qtwebsockets 照常构建），而且 arm64_sonoma /
  # arm64_sequoia 有现成 bottle，不用在 CI 上现编 Qt。
  # 两条腿只差 Qt 来源和部署下限：arm64 二进制的 macOS 下限只能是 11.0（Big Sur 是
  # 第一个 arm64 版本），写 10.14 会被 clang 直接拒。
  # Intel 标签必须带 -intel：macos-13 已于 2025-12-04 下线，任务会一直卡在 queued
  # （release 通过 needs 等它，等于整个发布不产出）。
  build-macos:
    name: macOS ${{ matrix.cfg.arch }}
    runs-on: ${{ matrix.cfg.runner }}
    strategy:
      # arm64 是新接入的腿，它挂了不能把已经验证过的 x86_64 包一起带走
      fail-fast: false
      matrix:
        cfg:
          - arch: x86_64
            runner: macos-15-intel
            qt_from: aqt
            deploy: '10.14'
          - arch: arm64
            runner: macos-15
            qt_from: brew
            deploy: '11.0'
    env:
      QT_VERSION: '5.15.2'
      FFMPEG_VER: '6.1.2'
      ARTIFACT_NAME: QtRemoteDesktop-macos-${{ matrix.cfg.arch }}.tar.gz
      APP_BUNDLE: bin/QtRemoteDesktop.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt_mac
        if: matrix.cfg.qt_from == 'aqt'
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # host 必须是 mac，不是 macos：action v4 校验的枚举是
          # windows | windows_arm64 | mac | linux | linux_arm64 | all_os，
          # 写错会在 Set up job 之后立刻 TypeError 退出（v1.2.1 实测）
          host: mac
          target: desktop
          arch: clang_64
          cache: false

      # aqt 取包偶发失败重试一次；Apple 腿跑一次成本高，不值得被一次网络抖动废掉
      - name: Retry Install Qt
        if: matrix.cfg.qt_from == 'aqt' && steps.qt_mac.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: false

      # keg-only：不会被 link 进 PATH，所以手动把前缀导出成 QT_ROOT_DIR，
      # 让后面每一步拿到和 aqt 腿同名的变量。
      # 必须换成物理路径：brew --prefix 给的是 .../opt/qt@5，它本身是个指向
      # Cellar/<版本> 的软链接，而 find 默认（-P）连命令行起点是软链接都不跟进，
      # 后面按名字找 framework 会全部空手而归。
      - name: Install Qt 5 (Homebrew, arm64)
        if: matrix.cfg.qt_from == 'brew'
        shell: bash
        run: |
          set -eo pipefail
          brew install qt@5 2>&1 | tee brew_qt.log
          P=$(brew --prefix qt@5)
          [ -n "$P" ] && [ -d "$P" ] || { echo "::error::brew 没给出 qt@5 前缀（得到 '$P'）"; exit 1; }
          P=$(cd "$P" && pwd -P)
          echo "qt@5 前缀: $P" | tee -a brew_qt.log
          echo "QT_ROOT_DIR=$P" | tee -a "$GITHUB_ENV"

      # 先把「几十分钟后才在链接期暴露」的前提一次性检查掉，失败点越早越好。
      # aqt 和 brew 的目录布局不完全一样（brew 把 framework 留在 lib/，另在
      # include/ 和 HOMEBREW_PREFIX/Frameworks 建软链），所以关键文件按名字找，
      # 不写死相对路径。
      # pipefail 不能省：整段是 `{ …; } | tee`，没有它的话组里 exit 1 会被
      # tee 的 0 覆盖，"检查"变成纯打印，缺件照样往下跑几十分钟。
      # 同理所有截断一律用 sed -n '1p'（读完整个流）而不是 head（提前关管道，
      # clang --version 有 4 行，被 SIGPIPE 打成 141 会误报失败）。
      - name: Preflight
        shell: bash
        run: |
          set -eo pipefail
          {
            echo "=== arch / Qt (${QT_ROOT_DIR:-未设置}) ==="
            uname -m
            [ -n "$QT_ROOT_DIR" ] || { echo "::error::QT_ROOT_DIR 未设置：Qt 安装步骤没成功"; exit 1; }
            test -x "$QT_ROOT_DIR/bin/qmake" \
              || { echo "::error::qmake 不在 $QT_ROOT_DIR/bin"; exit 1; }
            "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION
            lipo -archs "$QT_ROOT_DIR/bin/qmake" | sed 's/^/qmake arch: /'
            # WebSockets 缺失 → 链接期 -lQt5WebSockets not found
            WS=$(find "$QT_ROOT_DIR" -maxdepth 3 -type d -name 'QtWebSockets.framework' | sed -n '1p')
            [ -n "$WS" ] || { echo "::error::QtWebSockets.framework 未找到"; exit 1; }
            echo "QtWebSockets: $WS"
            lipo -archs "$WS/QtWebSockets" | sed 's/^/  arch: /'
            # macdeployqt 只会搬它认识的插件；cocoa 少一个就没法起
            COCOA=$(find "$QT_ROOT_DIR" -type f -name 'libqcocoa.dylib' | sed -n '1p')
            [ -n "$COCOA" ] || { echo "::error::cocoa 平台插件未找到"; exit 1; }
            echo "cocoa plugin: $COCOA"
            MDQ=$(find "$QT_ROOT_DIR" -type f -name 'macdeployqt' | sed -n '1p')
            [ -n "$MDQ" ] || { echo "::error::macdeployqt 未找到"; exit 1; }
            echo "MACDEPLOYQT=$MDQ" >> "$GITHUB_ENV"
            echo "macdeployqt: $MDQ"
            echo "=== OpenSSL (brew) ==="
            # openssl@3 是 keg-only，不会软链到系统 lib，find_library 默认找不到，
            # 下面 configure 必须把它并进 CMAKE_PREFIX_PATH
            OSSLP=$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)
            echo "OPENSSL_PREFIX=$OSSLP" | tee -a "$GITHUB_ENV"
            test -e "$OSSLP/lib/libssl.dylib" || { echo "::error::libssl.dylib 缺失"; exit 1; }
            echo "=== toolchain ==="
            cc --version | sed -n '1p'
            cmake --version | sed -n '1p'
            nasm -v 2>/dev/null || echo "(未装 nasm：CMake 会自动给 openh264 传 USE_ASM=No，编码慢一些但仍可构建)"
          } 2>&1 | tee preflight.log

      - name: Fetch FFmpeg sources
        shell: bash
        run: |
          set -o pipefail
          set -e
          {
            FFDIR=src/remotedesk/thridparty/ffmpeg
            mkdir -p "$FFDIR"
            # Apple 没有 NVIDIA 驱动，nv-codec-headers 用不上；硬编走系统自带的
            # VideoToolbox（BuildFFmpeg.cmake 里 APPLE 分支已经 --enable-videotoolbox）
            if [ ! -d "$FFDIR/FFmpeg-n$FFMPEG_VER" ]; then
              echo "=== downloading FFmpeg $FFMPEG_VER ==="
              curl -sSfL --retry 3 -o /tmp/ff.tar.gz \
                "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$FFMPEG_VER.tar.gz"
              tmp=$(mktemp -d)
              tar -xzf /tmp/ff.tar.gz -C "$tmp"
              src=$(find "$tmp" -mindepth 1 -maxdepth 1 -name "FFmpeg-*" | head -1)
              [ -n "$src" ] || { echo "::error::归档里没有 FFmpeg-* 目录"; exit 1; }
              mv "$src" "$FFDIR/FFmpeg-n$FFMPEG_VER"
              rm -rf "$tmp"
            fi
            chmod +x "$FFDIR/FFmpeg-n$FFMPEG_VER/configure"
            ls -l "$FFDIR/FFmpeg-n$FFMPEG_VER/configure"
          } 2>&1 | tee fetch_sources.log

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # 显式钉部署下限：不写的话 clang 把 minos 打成 runner 自己的系统版本
          # （macos-15 就是 15.0），等于产物只有最新系统能用。这里用到的
          # API 都远低于此（CGDisplayCreateImage 10.6+、CGEventPost 10.5+，
          # 10.15 的 CGPreflightScreenCaptureAccess 是 dlsym 运行期取的），
          # Qt 5.15.2 官方要求 10.13+，x86_64 取 10.14 留余量；
          # arm64 的下限由矩阵给（11.0），因为 arm64 macOS 只从 Big Sur 起存在。
          # BuildFFmpeg.cmake 会把同一个下限透传给 FFmpeg 的 configure，
          # 否则它的 .o 会按 SDK 版本打 minos，链接期刷一片
          # "built for newer 'macOS' version than being linked"。
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.cfg.deploy }}" \
            -DBUILD_THIRDPARTY=ON \
            -DFFMPEG_VERSION="$FFMPEG_VER" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$OPENSSL_PREFIX" 2>&1 | tee configure.log
          echo "=== FFmpeg 版本 / 硬编探测 ==="
          grep -E "FFmpeg 版本|硬件编码器自动探测|videotoolbox|WebRTC|x265" configure.log || true

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # 首次构建要现编 FFmpeg + openh264 + metaRTC + srtp + usrsctp，几十分钟量级
          # -- -k：make 默认撞到第一个错误就收摊，而 Apple 侧上次只编到 38%，后面还有
          # WebRTC/helper/主程序一大半 targets 从没在 Clang 下编过。用 -k 继续编其它
          # 目标，一轮就把错误清单全部暴露出来，不用一个错误烧一轮 CI。
          cmake --build build --parallel 3 -- -k 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "=== 本轮编译错误清单 ==="
          grep -E "error:" build.log | sed -E 's|^/Users/runner/work/[^/]+/[^/]+/||' | sort -u | head -60 || true
          ls -la "$APP_BUNDLE/Contents/MacOS/" 2>/dev/null || true
          [ "$rc" -eq 0 ] || { echo "::error::Build 失败 (rc=$rc)"; exit "$rc"; }

      - name: Package
        shell: bash
        run: |
          set -o pipefail
          {
            # macdeployqt 把 Qt framework、平台插件、qt.conf 一次性搬进 .app
            "$MACDEPLOYQT" "$APP_BUNDLE" -verbose=2 2>&1 | tee deploy.log
            # 平台插件没进去的包在目标机上直接起不来（"failed to load cocoa"）
            ls "$APP_BUNDLE/Contents/PlugIns/platforms/" | tee -a deploy.log
            # 架构必须是本腿目标架构：混进 x86_64/arm64 就说明 Qt 来源和 runner 不匹配
            lipo -archs "$APP_BUNDLE/Contents/MacOS/QtRemoteDesktop" | tee -a deploy.log

            # 冒烟要一个不需要 WindowServer 的 platform 插件。macdeployqt 只搬 cocoa，
            # 它写的 qt.conf 又把插件搜索限制在包内，所以包外的 offscreen 根本不会被找到
            # （v1.2.8 arm64：'Could not find the Qt platform plugin "offscreen"' → rc=134）。
            # 塞进包内让它跟其他 Mach-O 走同一套 id 规范化和闭包改写，冒完烟删掉——
            # 发布包只带 cocoa。
            # 顺序先 minimal 后 offscreen（v1.2.9 arm64 实测）：brew 的 libqoffscreen 除了
            # QtCore/QtGui 还直接引用 freetype/gettext/glib/gthread 四个非 framework 绝对
            # 路径，闭包只能把它们当裸文件搬进包内，而这些裸文件自己的下层依赖走 @rpath，
            # 包里没有对应 rpath → dlopen 失败 → 'Could not load ... even though it was
            # found' + rc=134。libqminimal 只引用 QtCore/QtGui 两个 framework，改写后就完
            # 全落在包内，不会往发布包里塞只服务于 CI 的裸 dylib。
            SMOKE_DIR="$APP_BUNDLE/Contents/PlugIns/platforms"
            SMOKE_QPA=""
            SMOKE_FILE=""
            for want in minimal offscreen; do
              # || true：find 撞到不可读子目录会返回 1，命令替换的退出码就是这条管道的
              # 退出码，-e 下会让整个打包步骤在"取冒烟插件"这一步原地死掉（v1.2.9 本地
              # 复现过：目录不存在时脚本零输出、退出码 1）。找不到插件由下面的空串判断兜住。
              src=$(find "$QT_ROOT_DIR" -type f -name "libq${want}.dylib" 2>/dev/null \
                    | sed -n '1p' || true)
              [ -n "$src" ] || continue
              SMOKE_FILE="$SMOKE_DIR/libq${want}.dylib"
              SMOKE_QPA="$want"
              cp -L "$src" "$SMOKE_FILE"
              chmod u+w "$SMOKE_FILE"
              echo "冒烟用平台插件：$src -> $SMOKE_FILE"
              break
            done

            # ---- 把包外 dylib 搬进 .app（brew 的 OpenSSL 等）----
            # macdeployqt 只搬 Qt 自己的 framework；libssl/libcrypto 来自 brew，
            # 链接期记的是 /usr/local/opt/... 绝对路径，用户机没装 brew 就
            # "dyld: Library not loaded" 直接起不来（在构建机上冒烟照样通过，
            # 所以这一步不能靠冒烟发现）。递归到依赖闭包，最后断言包内 Mach-O
            # 不再引用任何包外绝对路径。必须在 codesign 之前做完。
            # brew 的 Qt 还要多两招（v1.2.6 arm64 实测，aqt 腿的 @rpath 布局不走这两招）：
            #   1) otool -L 的第一条缩进行是文件自己的 install name，不是依赖。brew 把
            #      插件的 id 打成 /opt/homebrew/opt/qt@5/plugins/…，于是这十几个插件永远
            #      排在"待搬清单"里，5 趟都不收敛，断言必挂（把它们当依赖搬也没意义）。
            #      → 先把包内 Mach-O 的绝对 id 规范化成 @executable_path/…，再从依赖
            #      清单里排除 id 行，只看真引用。
            #   2) framework 的二进制 macdeployqt 已经搬进 Contents/Frameworks 了，再按
            #      整条绝对路径 cp 一次会得到 Frameworks/QtCore 这种裸文件副本，和
            #      framework 里的正本同时被装载。→ .framework 引用优先改写到包内已有正本。
            FW="$APP_BUNDLE/Contents/Frameworks"
            mkdir -p "$FW"
            machos() {
              find "$APP_BUNDLE/Contents" -type f | while read -r f; do
                # 每轮必须以 true 收尾：GitHub 的 shell: bash 默认就是 -e -o pipefail
                # （步骤里那行 set -o pipefail 只是重复声明），而 while 的返回状态取最后
                # 一次迭代。find 列到末尾基本都会撞上非 Mach-O（Info.plist、qml 资源等），
                # grep -q 的 1 就成了 machos 的 1，pipefail 把整条流水线判失败——
                # v1.2.7 两条 macOS 腿都在规范化循环跑完后立刻 exit 1，
                # 一行"外部依赖 pass 1"都没打出来。find 自己失败仍由 pipefail 暴露。
                file "$f" 2>/dev/null | grep -q 'Mach-O' && printf '%s\n' "$f" || true
              done
            }
            # id 行永远是第一条缩进的条目，但它的值可能是 @rpath/… 开头，
            # 所以判定只看缩进、不看前缀：只认 "/" 会让 @ 开头的 id 不被计数，
            # 结果把第一条真依赖当成 id 跳过（也会让 own_id 读错行）。
            # 取第一条用 seen 标记而不是 {print; exit}：exit 会提前关读端，写入方
            # 之后再有输出就吃 SIGPIPE，pipefail 下整条管道 141、set -e 直接杀步骤。
            own_id() { otool -L "$1" 2>/dev/null | awk '/^[[:space:]]+/ {if (!seen) {print $1; seen=1}}'; }
            # 依赖清单 = 缩进条目去掉第一条（自身 install name），且只要绝对路径形态
            ref_list() { otool -L "$1" 2>/dev/null | awk '/^[[:space:]]+/ {n++; if (n>1 && $1 ~ /^\//) print $1}'; }
            # 全部真引用（含 @rpath/@loader_path/@executable_path 形态），给 rpath 审计用
            ref_list_all() { otool -L "$1" 2>/dev/null | awk '/^[[:space:]]+/ {n++; if (n>1) print $1}'; }
            ext_deps() {
              machos | while read -r f; do ref_list "$f"; done \
                | sort -u | grep -vE '^(/usr/lib/|/System/|@rpath/|@executable_path/|@loader_path/)' || true
            }
            EXEDIR="$APP_BUNDLE/Contents/MacOS"
            # brew 的 dylib 之间用 @rpath/兄弟名 互相引用，靠各自的 LC_RPATH 解析。brew 的
            # 布局是 …/lib/libx.1.dylib + rpath @loader_path/../lib（也就是它自己的目录），
            # 一旦把裸文件搬进 Contents/Frameworks，@loader_path/../lib 就指向包里的
            # Contents/lib（不存在），兄弟全断。v1.2.10 的 arm64 产物实测断在这条链上：
            #   libqcocoa.dylib -> Frameworks/libfreetype.6.dylib
            #                   -> libbrotlidec.1.dylib -> @rpath/libbrotlicommon.1.dylib（包里没有）
            # 主程序自己不引用 freetype（brew 的 Qt 用 CoreText 排字），所以进程起得来、Qt
            # 能打印插件清单，直到 dlopen 平台插件才失败——CI 里那句 'Could not load the Qt
            # platform plugin ... even though it was found' 和干净 Mac 上双击打不开是同一个原因。
            # 上面那套绝对路径闭包看不见它：ext_deps 明确过滤掉了 @rpath 形态。
            # 修法两条：缺的兄弟从构建机搬进 Frameworks，再给引用方补一条
            # @executable_path/../Frameworks 的 rpath，让 @rpath 在包内就能解析。
            rpaths_of() {
              otool -l "$1" 2>/dev/null | awk '$1=="cmd" && $2=="LC_RPATH" {r=1; next}
                                               r && $1=="path" {print $2; r=0}'
            }
            # 只看包内的实际目录：引用方文件 + 它自己的 rpath 能不能落到一个真实文件上
            rpath_ok() {  # $1=引用方 $2=@rpath/… 引用
              local name=${2#@rpath/} rp cand
              for rp in $(rpaths_of "$1"); do
                case "$rp" in
                  @executable_path/*) cand="$EXEDIR/${rp#@executable_path/}/$name" ;;
                  @loader_path/*)     cand="${1%/*}/${rp#@loader_path/}/$name" ;;
                  /*)                 cand="$rp/$name" ;;
                  *)                  continue ;;
                esac
                if [ -e "$cand" ]; then return 0; fi
              done
              return 1
            }
            # 输出待补清单，每行 "引用方文件<TAB>@rpath/名字"
            # 结尾 || true 的理由和 ext_deps 一样：本函数只在 rt=$(rpath_todo) 这种命令
            # 替换里用，-e 下替换的非零状态会直接杀掉整个 Package 步骤；otool 读个别文件
            # 失败（非 Mach-O、权限）属于正常噪声，不该让它决定成败。
            rpath_todo() {
              machos | while read -r f; do
                ref_list_all "$f" | while read -r r; do
                  case "$r" in @rpath/*) ;; *) continue ;; esac
                  rpath_ok "$f" "$r" || printf '%s\t%s\n' "$f" "$r"
                done
              done || true
            }
            locate_lib() {  # $1=dylib 文件名，输出构建机上的实际路径
              local d hit
              for d in "$QT_ROOT_DIR/lib" "$QT_ROOT_DIR"/share/*/lib /opt/homebrew/opt/*/lib \
                       /usr/local/opt/*/lib; do
                if [ -f "$d/$1" ]; then printf '%s\n' "$d/$1"; return 0; fi
              done
              hit=$(find /opt/homebrew /usr/local -type f -name "$1" 2>/dev/null | sed -n '1p' || true)
              if [ -n "$hit" ]; then printf '%s\n' "$hit"; return 0; fi
              return 1
            }
            # 喂给它的已经是"每行一条纯路径"（ref_list 只 print $1），所以整行精确比对
            refs_dep() { grep -Fxq "$1"; }
            rewrite_everywhere() {  # $1=旧路径 $2=新引用
              machos | while read -r f; do
                ref_list "$f" | refs_dep "$1" || continue
                install_name_tool -change "$1" "$2" "$f"
              done
            }
            echo "=== 规范化包内 install name ==="
            machos | while read -r f; do
              # 主程序自己的 id 按惯例就是它的构建机路径，不参与 dyld 解析，别动
              [ "$f" = "$APP_BUNDLE/Contents/MacOS/QtRemoteDesktop" ] && continue
              id=$(own_id "$f")
              case "$id" in
                /*) ;;
                *) continue ;;
              esac
              rel=${f#"$APP_BUNDLE"/Contents/}
              echo "  $id -> @executable_path/../$rel"
              install_name_tool -id "@executable_path/../$rel" "$f"
            done
            for pass in 1 2 3 4 5; do
              todo=$(ext_deps)
              [ -z "$todo" ] && break
              echo "=== 外部依赖 pass $pass ==="
              echo "$todo"
              for dep in $todo; do
                [ -e "$dep" ] || { echo "::error::外部依赖在构建机上不存在，无法打包：$dep"; exit 1; }
                case "$dep" in
                  *.framework/*)
                    fwname=$(basename "${dep%%.framework/*}")
                    tail=${dep#*.framework/}
                    if [ -e "$FW/$fwname.framework/$tail" ]; then
                      rewrite_everywhere "$dep" "@executable_path/../Frameworks/$fwname.framework/$tail"
                      continue
                    fi
                    ;;
                esac
                base=$(basename "$dep")
                if [ ! -e "$FW/$base" ]; then
                  cp -L "$dep" "$FW/$base"
                  chmod u+w "$FW/$base"
                  install_name_tool -id "@executable_path/../Frameworks/$base" "$FW/$base"
                fi
                rewrite_everywhere "$dep" "@executable_path/../Frameworks/$base"
              done
            done
            echo "=== 补 @rpath 兄弟依赖 ==="
            for pass in 1 2 3 4 5; do
              rt=$(rpath_todo)
              if [ -z "$rt" ]; then break; fi
              echo "--- pass $pass：$(printf '%s\n' "$rt" | grep -c . || true) 条 @rpath 引用解析不了"
              printf '%s\n' "$rt" | sed 's/^/  /'
              while IFS=$'\t' read -r f ref; do
                name=${ref#@rpath/}
                if [ ! -e "$FW/$name" ]; then
                  src=$(locate_lib "$name") \
                    || { echo "::error::@rpath 依赖在构建机上找不到，无法打包：$ref（引用方 $f）"; exit 1; }
                  cp -L "$src" "$FW/$name"
                  chmod u+w "$FW/$name"
                  install_name_tool -id "@executable_path/../Frameworks/$name" "$FW/$name"
                  echo "  搬入 $name（来自 $src）"
                fi
                # 已经补过就不再调一次注定失败的 install_name_tool（同一条 rpath 不能重复），
                # 失败本身由下面的 || true 兜住，但每个 pass 都刷一遍错误会把日志淹掉。
                if ! rpaths_of "$f" | grep -qx '@executable_path/../Frameworks'; then
                  install_name_tool -add_rpath "@executable_path/../Frameworks" "$f" 2>&1 \
                    | sed 's/^/  add_rpath: /' || true
                fi
              done <<< "$rt"
            done
            left=$(ext_deps)
            if [ -n "$left" ]; then
              echo "::error::产物仍依赖包外 dylib（目标机会 dyld 打不开）："
              echo "$left"
              exit 1
            fi
            left_rpath=$(rpath_todo)
            if [ -n "$left_rpath" ]; then
              echo "::error::包内仍有解析不了的 @rpath 依赖（目标机 dyld 会打不开）："
              printf '%s\n' "$left_rpath" | sed 's/^/  /'
              exit 1
            fi
            otool -L "$APP_BUNDLE/Contents/MacOS/QtRemoteDesktop" | tee deps_after.log

            # 代码签名：TCC（屏幕录制/辅助功能）的授权记录是绑在签名的 Designated
            # Requirement 上的，未签名的包每次重编都要重新勾一次；x86_64 虽然不签也
            # 能跑，但授权会反复失效。这里做 ad-hoc 签名（-），不需要开发者证书。
            # --force 会重签内部所有 framework，--deep 让主程序最后签。
            codesign --force --deep --sign - "$APP_BUNDLE" 2>&1 | tee codesign.log
            codesign -dv --verbose=2 "$APP_BUNDLE" 2>&1 | head -5

            # 冒烟：跑 --version 证明所有 dylib/framework 真能解析、Qt 能起。
            # CI 上没有 WindowServer 会话，cocoa 插件起不来，用上面塞进来的无窗口插件。
            # 这只验链接，不验界面；界面要等真机。
            # 不是硬门禁：插件装不上的原因基本都出在构建机 Qt 的插件形态（@rpath 裸依赖之
            # 类），而不是产物本身——产物自包含由上面的闭包断言负责。失败时打 ::warning::
            # 并把 QT_DEBUG_PLUGINS 的正文留在日志里，别让 arm64 再卡在最后一步。
            export DYLD_FRAMEWORK_PATH="$PWD/$APP_BUNDLE/Contents/Frameworks"
            if [ -n "$SMOKE_QPA" ]; then
              echo "=== 冒烟插件的引用 ==="
              otool -L "$SMOKE_FILE" | sed 's/^/  /'
              set +e
              QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM="$SMOKE_QPA" \
                "$APP_BUNDLE/Contents/MacOS/QtRemoteDesktop" --version 2>&1 | tee smoke.log
              rc=${PIPESTATUS[0]}
              set -e
              if [ "$rc" -eq 0 ]; then
                echo "冒烟通过（QT_QPA_PLATFORM=$SMOKE_QPA）"
              else
                echo "::warning::打包后冒烟未通过 (rc=$rc)：包内 dylib 实载未经 CI 验证；" \
                  "依赖闭包断言已通过，界面与实载等真机（详见 smoke.log）"
              fi
            else
              echo "::warning::构建机 Qt 里没有 minimal/offscreen 平台插件，跳过冒烟" \
                "（依赖闭包断言已通过；界面与 dyld 实载等真机）"
            fi
            # 冒烟插件不进发布包（目标机只需要 cocoa）。注意必须在删完之后再签一次：
            # --deep 会把 PlugIns 里的每个 Mach-O 封进外层 CodeResources，先签后删会让
            # 外层签名指向一个已不存在的嵌套内容（codesign -v 报 missing/invalid）。
            if [ -n "$SMOKE_QPA" ]; then
              rm -f "$SMOKE_FILE"
              codesign --force --deep --sign - "$APP_BUNDLE" 2>&1 | tee -a codesign.log
            fi
            # 冒烟会在工作目录留下 logs/ 与 server_config.json，别打进发布包
            rm -rf logs server_config.json

            # .app 的符号链接和权限必须原样保留 → 打成 tar（不用 zip）
            tar -czf "$ARTIFACT_NAME" -C bin QtRemoteDesktop.app
            ls -la "$ARTIFACT_NAME"
          } 2>&1 | tee package.log

      - name: Verify artifact exists
        shell: bash
        run: |
          test -f "$ARTIFACT_NAME" || { echo "::error::产物缺失: $ARTIFACT_NAME"; exit 1; }
          ls -la "$ARTIFACT_NAME"

      - name: Dump logs to logs branch
        if: failure()
        shell: bash
        run: |
          set +e
          BR="logs-macos-${{ matrix.cfg.arch }}"
          git config user.email "ci@remotedesk.local"
          git config user.name "remotedesk-ci"
          git fetch origin "$BR" 2>/dev/null || true
          git checkout -B "$BR" "origin/$BR" 2>/dev/null || git checkout -B "$BR"
          mkdir -p ci-logs
          {
            echo "=== pwd: $(pwd)"
            for f in preflight.log brew_qt.log fetch_sources.log configure.log build.log deploy.log codesign.log smoke.log package.log; do
              echo "=== $f ==="
              cat "$f" 2>/dev/null || echo "(不存在)"
            done
            # -k 之后一轮可能带出几十条错误，80 行会截掉后面的
            echo "=== 错误摘要 ==="
            grep -inE "error|undefined|cannot find|No such file|fatal" \
              build.log configure.log 2>/dev/null | tail -250
          } > ci-logs/all.log
          git add -f ci-logs/all.log
          git commit -m "ci logs: macOS ${{ matrix.cfg.arch }} run ${{ github.run_id }} $(date -u +%Y%m%d%H%M%S)" || true
          git push --force origin "$BR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.cfg.arch }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  # ==========================================================================
  # Android（arm64-v8a，Qt 6 + NDK 交叉编译）
  # ==========================================================================
  # 桌面三条腿 + macOS 都建立在 Qt 5.15 上，Android 端要求 Qt 6（qt_finalize_executable
  # + androiddeployqt 的 Gradle 工程模板），所以不能并进 build 矩阵，单独一个 job。
  # FFmpeg 源码已入库（src/remotedesk/thridparty/ffmpeg/FFmpeg-n6.1.2，8190 个文件），
  # 这里不下载；build_ffmpeg_android.ps1 用 NDK 的 clang 交叉编出 arm64 静态库，
  # 只启 mediacodec/jni/h264_mediacodec + h264_metadata BSF。
  # APK 是签名后才能装的：Qt 6 的 CMake 流程不签（androiddeployqt 只交 gradle 的
  # android-build-release-unsigned.apk，QT_ANDROID_KEYSTORE_* 属性只有 Qt5/qmake 模板读），
  # 所以打包脚本自己 zipalign + apksigner，签名身份取仓库内的
  # src/android_build_script/debug.keystore（公开 debug 身份，不是商店签名），
  # 末尾再用 apksigner verify 复检，验不过直接判失败。
  build-android:
    name: Android arm64-v8a
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      QT_ANDROID_VER: '6.11.1'
      # 这三个版本由 Qt 6.11.1 自己写进生成的 gradle.properties（androidBuildToolsVersion /
      # androidCompileSdkVersion / androidNdkVersion），换 Qt 版本要跟着改，否则 Gradle
      # 报 "Failed to find Build Tools revision ..."。
      ANDROID_BUILD_TOOLS: '37.0.0'
      ANDROID_PLATFORM: 'android-36'
      ANDROID_NDK_VER: '27.1.12297006'
      ARTIFACT_NAME: QtRemoteDesktop-android-arm64-v8a.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 两个组件缺一不可：android_arm64_v8a 是被编译的 kit，桌面 kit 是 QT_HOST_PATH
      # （moc/uic/rcc/androiddeployqt 都是主机可执行文件）。tools_mingw1310 只为
      # FFmpeg 的交叉编译提供 mingw32-make —— NDK 和 Git 都不带 GNU make。
      #
      # 这里不走 jurplel/install-qt-action：它默认的 aqtinstall 3.3.* 还按 Qt 6.9 的
      # 仓库路径找包，6.11 起桌面 kit 变成 qt6_6111/qt6_6111_mingw/、移动 kit 整体搬到
      # all_os/android/，aqt 直接报 "Failed to locate XML data for Qt version"（v1.5.3
      # 的这条腿就是挂在这）。上游修好了但没发版，所以用仓库内的镜像安装器，
      # 它读 Updates.xml 自己拼 URL，并按官方 .sha1 校验每个归档。
      - name: Install Qt 6 from mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 装到 RUNNER_TEMP 而不是工作区里：这份 Qt 有 3G+，留在 checkout 目录里会污染
          # 后面"Dump logs to logs branch"那步的 git 视角
          $qtRoot = Join-Path $env:RUNNER_TEMP 'Qt'
          "QT_MIRROR_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          for ($i = 1; $i -le 2; $i++) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File src/android_build_script/install_qt_mirror.ps1 `
                -Version $env:QT_ANDROID_VER -OutDir $qtRoot
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "镜像安装第 $i 次失败 (exit $LASTEXITCODE)"
            Start-Sleep -Seconds (15 * $i)
          }
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Qt 镜像安装两次都失败'; exit 1 }

      - name: JDK 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 安装器把 kit 摆在 <OutDir>\<版本>\<kit>，和官方安装目录同构，所以这里给脚本的是
      # 版本根目录（build_android.ps1 要在里面同时找 android kit 和桌面 kit）；
      # make 的目录名随上游变化，按实际文件找而不是写死。
      - name: Export Qt roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $verRoot = Join-Path $env:QT_MIRROR_ROOT $env:QT_ANDROID_VER
          foreach ($need in @('android_arm64_v8a\bin\qt-cmake.bat', 'mingw_64\bin\androiddeployqt.exe')) {
            if (-not (Test-Path (Join-Path $verRoot $need))) {
              Write-Host "::error::$verRoot 下没有 $need"
              exit 1
            }
          }
          "QT_ANDROID_ROOT=$verRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Qt 版本根目录: $verRoot"
          $make = @(Get-ChildItem (Join-Path $env:QT_MIRROR_ROOT 'Tools') -Recurse -Filter 'mingw32-make.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1) | Select-Object -First 1
          if (-not $make) {
            Write-Host "::error::找不到 mingw32-make.exe（tools_mingw1310 未装上？）"
            exit 1
          }
          Write-Host "GNU make: $($make.FullName)"
          $make.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # FFmpeg 的 configure 用 Get-Command sh / perl 找 POSIX 工具；Git for Windows 把它们
      # 放在 usr\bin，而 runner 默认 PATH 只有 Git\cmd 与 Git\bin。后面 GITHUB_PATH 里
      # 追加的目录排在最前，会盖住同名工具，这里只补这一个目录、不整块改 PATH。
      - name: Expose Git's usr\bin (sh + perl)
        shell: bash
        run: |
          sh_path=$(command -v sh || true)
          perl_path=$(command -v perl || true)
          [ -n "$sh_path" ] && [ -n "$perl_path" ] || { echo "::error::Git 的 sh/perl 未找到"; exit 1; }
          cygpath -w "$(dirname "$sh_path")" >> "$GITHUB_PATH"
          ls -l "$sh_path" "$perl_path"

      # FFmpeg configure 在库里是 100644（Git for Windows 不看模式位，本机跑得起来），
      # CI checkout 后 sh 直接 exec 会 Permission denied。
      - name: Mark FFmpeg configure executable
        shell: bash
        run: |
          set -e
          f=src/remotedesk/thridparty/ffmpeg/FFmpeg-n6.1.2/configure
          test -f "$f" || { echo "::error::$f 不在库里"; exit 1; }
          chmod +x "$f"
          ls -l "$f"

      - name: Install Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $sdk = Join-Path $env:RUNNER_TEMP 'android-sdk'
          $mgr = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $mgr)) {
            $zip = Join-Path $env:RUNNER_TEMP 'cmdline-tools.zip'
            $stage = Join-Path $env:RUNNER_TEMP 'cmdline-tools-stage'
            # 取最新一版 cmdline-tools：build-tools;37.0.0 / platforms;android-36 是 2025 年
            # 之后才出现的包，老 sdkmanager 解析不了新仓库元数据
            $url = 'https://dl.google.com/android/repository/commandlinetools-win-16111833_latest.zip'
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
                break
              } catch {
                Write-Host "第 $i 次取 cmdline-tools 失败：$($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $i)
              }
            }
            if (-not (Test-Path $zip)) { Write-Host '::error::cmdline-tools 三次都没取到'; exit 1 }
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            # zip 里的根目录就叫 cmdline-tools，而 sdkmanager 要求 …/cmdline-tools/latest/bin
            $latest = Join-Path $sdk 'cmdline-tools\latest'
            Remove-Item $latest -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path (Split-Path $latest) | Out-Null
            Move-Item -Path (Join-Path $stage 'cmdline-tools') -Destination $latest -Force
          }
          if (-not (Test-Path $mgr)) { Write-Host "::error::sdkmanager.bat 未就位：$mgr"; exit 1 }
          # license 不先签下来，--install 会在第一个需要授权的包上非零退出
          (1..30 | ForEach-Object { 'y' }) | & $mgr --licenses --sdk_root=$sdk | Select-Object -Last 2
          & $mgr --sdk_root=$sdk --install `
              "platform-tools" "platforms;$env:ANDROID_PLATFORM" `
              "build-tools;$env:ANDROID_BUILD_TOOLS" "ndk;$env:ANDROID_NDK_VER" "cmake;3.31.6"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::sdkmanager --install 失败 (exit $LASTEXITCODE)"; exit 1 }
          foreach ($need in @("ndk\$env:ANDROID_NDK_VER\ndk-build.cmd",
                              "build-tools\$env:ANDROID_BUILD_TOOLS\apksigner.bat",
                              "platforms\$env:ANDROID_PLATFORM\android.jar",
                              'cmake\3.31.6\bin\ninja.exe')) {
            if (-not (Test-Path (Join-Path $sdk $need))) {
              Write-Host "::error::SDK 缺 $need"; exit 1
            }
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # AGP 8 只认 ANDROID_HOME（ANDROID_SDK_ROOT 已废弃）；androiddeployqt 生成的
          # local.properties 里 sdk.dir 也来自这个根目录，两个变量都给同一份 SDK
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Android SDK: $sdk"

      - name: Build APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 构建脚本自己写日志（build_android\android_build-<时间戳>.log），这里只做透传；
          # 步骤退出码必须原样交给 Actions，否则门槛会被 tee 的 0 覆盖
          & pwsh -NoProfile -ExecutionPolicy Bypass -File src/android_build_script/build_android.ps1 `
              -DeploymentType Release -BuildDir (Join-Path $env:GITHUB_WORKSPACE 'build_android')
          exit $LASTEXITCODE

      - name: Collect APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 只认脚本 zipalign+apksigner 之后落地的正式名字；android-build 目录里还有
          # gradle 自己产出的 -unsigned 和 androiddeployqt 拷的 QtRemoteDesktop.apk，
          # 那两个装了会报 INSTALL_PARSE_FAILED_NOT_APK
          $apk = Get-ChildItem -Path build_android -Filter 'android-build-release.apk' -Recurse -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { Write-Host '::error::没找到已签名的 android-build-release.apk'; exit 1 }
          Write-Host "APK: $($apk.FullName) ($($apk.Length) bytes)"
          Copy-Item $apk.FullName $env:ARTIFACT_NAME -Force
          Get-Item $env:ARTIFACT_NAME | Select-Object Name, Length
          exit 0

      - name: Verify artifact exists
        shell: bash
        run: |
          test -f "$ARTIFACT_NAME" || { echo "::error::产物缺失: $ARTIFACT_NAME"; exit 1; }
          ls -la "$ARTIFACT_NAME"

      - name: Dump logs to logs branch
        if: failure()
        shell: bash
        run: |
          set +e
          BR="logs-android-arm64-v8a"
          git config user.email "ci@remotedesk.local"
          git config user.name "remotedesk-ci"
          git fetch origin "$BR" 2>/dev/null || true
          git checkout -B "$BR" "origin/$BR" 2>/dev/null || git checkout -B "$BR"
          mkdir -p ci-logs
          {
            echo "=== pwd: $(pwd)"
            echo "=== env ==="
            env | grep -iE 'qt_|android|java' | sort
            for f in build_output/ffmpeg_build-6.1.2-android-arm64/configure.log \
                     build_output/ffmpeg_build-6.1.2-android-arm64/make.log; do
              echo "=== $f ==="
              cat "$f" 2>/dev/null || echo "(不存在)"
            done
            # 日志名带时间戳（gradle daemon 会长期占住固定名字的写句柄），全部收进来
            for f in build_android/android_build*.log; do
              [ -f "$f" ] || continue
              echo "=== $f ==="
              tail -c 400000 "$f" || true
            done
            echo "=== 错误摘要 ==="
            grep -inE "error|undefined|cannot find|No such file|Permission denied|FAILED:|fatal" \
              build_android/android_build*.log 2>/dev/null | tail -250
          } > ci-logs/all.log
          # .gitignore 里有 build*/，必须 -f 才加得进来
          git add -f ci-logs/all.log
          git commit -m "ci logs: Android arm64-v8a run ${{ github.run_id }} $(date -u +%Y%m%d%H%M%S)" || true
          git push --force origin "$BR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  # 汇总发布：各 job 并发往同一个 release 传文件会互相覆盖（release 是同一个对象），
  # 所以改成各 job 只交产物，由这一个 job 一次性上传。
  release:
    name: Publish release
    needs: [build, build-macos, build-android]
    # macOS 刚接入，链接级问题可能还要几轮才能清干净，所以它不参与发布门槛：
    # Windows/Linux 全绿就照发，macOS 失败时那个 asset 自然不存在（glob 落空不影响发布）。
    # Android 反过来：APK 一旦进不了门槛，release 又会变成"看起来有产物但没有安装包"
    # （v1.5.2 之前就是这个状态），所以它的 result 必须是 success。
    # always() + !cancelled() 是为了让 mac job 跑完（成功或失败）而不是把它当不存在；
    if: >-
      always() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      needs['build-android'].result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List
        run: find release-assets -type f -printf '%p %s bytes\n'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # 用上一个 tag 到本 tag 的提交记录自动生成发布说明，
          # 否则 release 页面是空的，用户不知道这一版改了什么
          generate_release_notes: true
          files: |
            release-assets/*/*.zip
            release-assets/*/*.tar.gz
            release-assets/*/*.apk
