                case 'cursor_pos':
                    updateRemoteCursor(msg.x, msg.y);
                    break;
                case 'codec_config':
                    if (msg.extradata && state.decoder) {
                        const extra = Uint8Array.from(atob(msg.extradata), c => c.charCodeAt(0));
                        if (extra.byteLength > 0)
                            state.decoder.configure(extra);
                    }
                    break;
                case 'file_list':
                    if (msg.items) renderFileList(msg.items);
                    if (msg.path) {
                        currentRemotePath = msg.path;
                        document.getElementById('file-path-input').value = msg.path;
                    }
                    break;
                case 'file_download_start':
                    // 初始化分块下载缓冲区（限 2GB，防止异常/恶意 totalSize 一次性分配超大数组导致浏览器 OOM）
                    if (!(msg.totalSize > 0 && msg.totalSize <= 2 * 1024 * 1024 * 1024)) {
                        showTransferStatus('下载失败：文件大小异常(' + (msg.totalSize || '未知') + '字节)', 4000);
                        break;
                    }
                    downloadBuffers[msg.path] = {
                        data: new Uint8Array(msg.totalSize),
                        received: 0,
                        totalSize: msg.totalSize,
                        name: msg.name
                    };
                    currentTransferPath = msg.path;
                    currentTransferType = 'download';
                    showTransferMonitor('⬇', msg.name, 0, msg.totalSize, 0);
                    break;
                case 'file_download_end':
                    // 完成分块下载，触发浏览器下载
                    const dlEntry = downloadBuffers[msg.path];
                    if (dlEntry) {
                        const blob = new Blob([dlEntry.data]);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = dlEntry.name;
                        a.click();
                        URL.revokeObjectURL(url);
                        showTransferStatus(`下载完成: ${dlEntry.name}`, 2000);
                        delete downloadBuffers[msg.path];
                    }
                    if (currentTransferPath === msg.path) {
                        hideTransferMonitor();
                    }
                    break;
                case 'transfer_progress':
                    if (msg.path === currentTransferPath) {
                        const pct = msg.total > 0 ? Math.round(msg.transferred / msg.total * 100) : 0;
                        showTransferMonitor(currentTransferType === 'upload' ? '⬆' : '⬇',
                            msg.path.split('/').pop(), msg.transferred, msg.total, msg.speedKBps);
                        if (msg.transferred >= msg.total) {
                            setTimeout(hideTransferMonitor, 1000);
                        }
                    }
                    break;
                case 'file_download':
                    if (msg.error) alert('下载失败: ' + msg.error);
                    break;
                case 'screen_locked':
                    document.getElementById('lock-overlay').classList.toggle('active', msg.locked);
                    if (msg.locked) {
                        document.getElementById('lock-password').focus();
                        const hintEl = document.getElementById('lock-hint');
                        const isXP = msg.isXP;
                        hintEl.innerHTML = isXP ? 'XP 锁屏：请点击上图锁中 <svg viewBox="0 0 16 16" width="14" height="14" style="vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><circle cx="7" cy="7" r="3"/><path d="M9.5 9.5l5 5"/><line x1="12" y1="12" x2="13" y2="13"/></svg> 部分然后多试几次' : (msg.hint || '');
                    } else {
                        document.getElementById('lock-password').value = '';
                        document.getElementById('lock-hint').textContent = '';
                    }
                    break;
                case 'clipboard':
                    // 远端剪贴板变化 → 存入缓冲，下一次用户手势时写入本地系统剪贴板
                    onRemoteClipboard(msg.text || '');
                    break;
                case 'file_upload_done':
                    refreshFileList();
                    if (currentTransferPath === msg.path) {
                        setTimeout(hideTransferMonitor, 500);
                    }
                    break;
                case 'server_config':
                    state.currentConfig.quality = msg.quality === 80 ? 'high' : msg.quality === 60 ? 'medium' : msg.quality === 35 ? (msg.fps >= 30 ? 'low' : 'verylow') : 'medium';
                    state.currentConfig.fps = msg.fps;
                    state.currentConfig.scale = msg.scale || 100;
                    if (msg.resolutions)
                        state.resolutions = msg.resolutions;

                    // 当前分辨率优先从消息中读取，其次从 screen_info
                    if (msg.currentResolution) {
                        state.currentConfig.resolution = msg.currentResolution;
                    } else if (state.screenWidth > 0) {
                        state.currentConfig.resolution = state.screenWidth + 'x' + state.screenHeight;
                    }
                    if (msg.outputs)
                        state.outputs = msg.outputs;
                    if (typeof msg.currentOutput === 'number')
                        state.currentConfig.screen = msg.currentOutput;
                    buildScreenOptions();
                    buildResolutionOptions();
                    updateDropdownActive();
                    updateQualityLabel();
                    break;
                case 'mode_changed':
                    if (typeof msg.hwEncode === 'boolean')
                        state.hwEncode = msg.hwEncode;
                    // 服务端主动切回图片模式（如编码器初始化失败回退）时，本地必须同步
                    // 停掉 MSE/WebRTC：否则残留的全屏 <video> 盖住 canvas，JPEG 帧画在
                    // 底下不可见，画面冻结在最后一帧视频。
                    if (msg.mode === 'image' && (msePlayer.using || webrtcState.active || webrtcState.pc || webrtcState.intending)) {
                        msePlayer.stop('mode_changed-image');
                        webrtcClose();
                    }
                    // 记录服务端当前编码协议（供调试/回显；不强制覆盖用户选择）
                    if (msg.codec && (msg.codec === 'h264' || msg.codec === 'hevc'))
                        state.serverCodec = msg.codec;
                    // 刷新/重连后按持久化模式恢复一次（服务端重启后默认回到 image）
                    if (!state.modeRestored && state.currentConfig.videomode !== 'auto') {
                        state.modeRestored = true;
                        const pref = state.currentConfig.videomode;
                        const wantSrv = pref === 'image' ? 'image' : 'video';
                        if (wantSrv !== msg.mode) {
                            applyStreamMode(pref);
                            return;
                        }
                        // 服务端模式已符合用户选择：同步菜单高亮（displayStreamMode 初始值不可靠），
                        // 否则刷新后高亮会错误地落到初始 'ffmpeg'
                        if (pref === 'webrtc' && msg.webrtc !== false) {
                            state.displayStreamMode = 'webrtc';
                            updateDropdownActive();
                            if (!webrtcState.active && !webrtcState.pc) {
                                setTimeout(initWebRTC, 500);
                                return;
                            }
                        } else {
                            state.displayStreamMode = pref;
                            updateDropdownActive();
                        }
                    }
                    // 自动模式时，按服务端实际模式更新配置菜单高亮
                    if (state.currentConfig.videomode === 'auto') {
                        state.displayStreamMode = (msg.mode === 'image') ? 'image' : (webrtcState.active ? 'webrtc' : 'ffmpeg');
                        updateDropdownActive();
                    }
                    if (msg.webrtc === true) {
                        const pref = state.currentConfig.videomode;
                        if (pref === 'auto') {
                            // 无论是否硬件加速都尝试 WebRTC（服务端软编也可走 RTP，
                            // 浏览器 <video> 原生解码，不依赖 WebCodecs，延迟最低）。
                            if (!webrtcState.active && !webrtcState.pc) {
                                setTimeout(initWebRTC, 500);
                            }
                        } else if (pref !== 'ffmpeg' && pref !== 'image' && !webrtcState.active && !webrtcState.pc) {
                            setTimeout(initWebRTC, 500); // 等 WS 稳定后再发起
                        }
                    } else if (msg.webrtc === false) {
                        webrtcClose();
                    }
                    break;
                case 'signal_offer':
                    onWebRtcOffer(msg.sdp);
                    break;
                case 'signal_ice':
                    onWebRtcIce(msg.candidate, msg.mid);
                    break;
                case 'signal_state':
                    if (msg.state === 'failed' || msg.state === 'unsupported')
                        webrtcClose();
                    break;
                case 'error':
                    alert('错误: ' + (msg.message || '未知错误'));
                    break;
            }
        }

        function send(data) {
            if (state.ws?.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify(data));
            }
        }

        // ---- 系统操作（快捷键面板）：锁屏/显示桌面/任务管理器/注销/重启/关机 ----
        function toggleSysMenu(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('sys-menu');
            const btn = document.getElementById('btn-sys');
            const opened = m.classList.toggle('open');
            if (opened && btn) {
                const r = btn.getBoundingClientRect();
                // 先开再测：display:flex 后才有实际宽高
                const mw = m.offsetWidth;
                const mh = m.offsetHeight;
                let left = r.left;
                let top = r.bottom + 8;
                // 水平不超视口右/左缘
                if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
                if (left < 8) left = 8;
                // 垂直：底部放不下则上翻到按钮上方
                if (top + mh > window.innerHeight - 8) top = r.top - mh - 8;
                if (top < 8) top = 8;
                m.style.left = left + 'px';
                m.style.top = top + 'px';
            }
        }
        function systemAction(action) {
            const names = { lock: '锁屏', show_desktop: '显示桌面', task_manager: '任务管理器',
                logout: '注销', reboot: '重启', poweroff: '关机' };
            const destructive = ['reboot', 'poweroff', 'logout'];
            if (destructive.includes(action) && !confirm('确定要对被控端执行「' + (names[action] || action) + '」吗？'))
                return;
            send({ type: 'system_action', action: action });
            document.getElementById('sys-menu').classList.remove('open');
        }
        // 点击页面其它位置关闭系统菜单
        document.addEventListener('click', function (ev) {
            const wrap = document.getElementById('sys-wrap');
            const m = document.getElementById('sys-menu');
            if (wrap && m && !wrap.contains(ev.target) && !m.contains(ev.target)) m.classList.remove('open');
        });

        // 锁定密码输入
        function sendChar(char, isDown) {
            send({ type: isDown ? 'keydown' : 'keyup', keycode: char.charCodeAt(0), code: '', ctrl: false, alt: false, shift: false, isChar: true });
        }
        function unlockScreen() {
            const input = document.getElementById('lock-password');
            const btn = document.getElementById('lock-unlock-btn');
            const pwd = input.value;
            if (!pwd) return;
            btn.disabled = true;
            btn.textContent = '发送中…';
            let i = 0;
            function sendNext() {
                if (i < pwd.length) {
                    sendChar(pwd[i], true);
                    setTimeout(() => {
                        sendChar(pwd[i], false);
                        i++;
                        setTimeout(sendNext, 20);
                    }, 10);
                } else {
                    // Enter key
                    send({ type: 'keydown', keycode: 13, code: 'Enter', ctrl: false, alt: false, shift: false });
                    setTimeout(() => {
                        send({ type: 'keyup', keycode: 13, code: 'Enter' });
                        btn.disabled = false;
                        btn.textContent = '解锁';
                        input.value = '';
                        input.focus();
                    }, 10);
                }
            }
            sendNext();
        }
        // Enter 键触发解锁
        document.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            if (e.key === 'Enter' && document.getElementById('lock-overlay').classList.contains('active') && document.activeElement === document.getElementById('lock-password')) {
                unlockScreen();
            }
        });

        // ==================== 输入处理 ====================
        function setupInputs() {
            const canvas = state.canvas;

            // 鼠标移动 (节流)
            let lastMove = 0;
            canvas.addEventListener('mousemove', (e) => {
                const now = performance.now();
                if (now - lastMove < 1000 / 60) return; // 60Hz 节流
                lastMove = now;

                const pos = getCanvasPos(e);
                state.mouseX = pos.x;
                state.mouseY = pos.y;

                send({
                    type: 'mousemove',
                    x: Math.round(pos.x),
                    y: Math.round(pos.y)
                });
            });

            // 鼠标按钮
            canvas.addEventListener('mousedown', (e) => {
                // 点击画面时让画布获得焦点，作为远程键盘输入的焦点载体，
                // 避免与本地输入框（文件路径框等）混淆
                try { state.canvas.focus({ preventScroll: true }); } catch (err) {}
                e.preventDefault();
                const pos = getCanvasPos(e);
                send({
                    type: 'mousedown',
                    x: Math.round(pos.x),
                    y: Math.round(pos.y),
                    button: e.button // 0=left, 1=middle, 2=right
                });
            });

            canvas.addEventListener('mouseup', (e) => {
                const pos = getCanvasPos(e);
                send({
                    type: 'mouseup',
                    x: Math.round(pos.x),
                    y: Math.round(pos.y),
                    button: e.button
                });
            });

            // 滚轮
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                send({
                    type: 'wheel',
                    delta: -Math.sign(e.deltaY) // 1=up, -1=down
                });
            }, { passive: false });

            // 键盘
            window.addEventListener('compositionend', (e) => {
                if (e.data) {
                    for (const ch of e.data) {
                        send({ type: 'keydown', keycode: ch.charCodeAt(0), code: '', ctrl: false, alt: false, shift: false, isChar: true });
                        send({ type: 'keyup', keycode: ch.charCodeAt(0), code: '' });
                    }
                }
            });
            function isLockInputFocused() {
                const overlay = document.getElementById('lock-overlay');
                return overlay && overlay.classList.contains('active') &&
                    document.activeElement === document.getElementById('lock-password');
            }
            window.addEventListener('keydown', (e) => {
                if (e.isComposing) return;
                // 锁屏密码输入框获取焦点时，不拦截键盘事件（允许 Backspace 等原生行为）
                if (isLockInputFocused()) return;
                // 焦点在本地可编辑元素（文件路径框/Shell 输入框等）时不拦截、不转发，
                // 让浏览器原生输入正常工作；否则 preventDefault 会让输入框像“失去焦点”
                const ft = e.target;
                if (ft && (ft.tagName === 'INPUT' || ft.tagName === 'TEXTAREA' || ft.isContentEditable)) return;

                // ---- 工具栏快捷键（仅使用不冲突的键） ----
                // F11: 全屏切换（浏览器标准快捷键）
                // Ctrl+Shift+Q: 画质切换（罕见组合，不冲突）
                if (e.code === 'F11') {
                    toggleFullscreen();
                    e.preventDefault();
                    return;
                }
                if (e.ctrlKey && e.shiftKey && e.code === 'KeyQ') {
                    toggleConfigDropdown();
                    e.preventDefault();
                    return;
                }

                // 剪贴板粘贴（Ctrl+V）：不 preventDefault，让浏览器触发 paste 事件，
                // 由下方剪贴板处理器读取本地剪贴板并同步到远端（远端由服务端注入 Ctrl+V）。
                // 若这里 preventDefault，浏览器会取消整个粘贴动作，paste 事件不会触发。
                if (e.ctrlKey && e.code === 'KeyV' && !e.altKey && !e.shiftKey && !e.metaKey) return;

                // 防止远程输入重复
                e.preventDefault();
                if (state.keysPressed.has(e.code)) return;

                state.keysPressed.add(e.code);
                send({
                    type: 'keydown',
                    keycode: e.keyCode,
                    code: e.code,
                    ctrl: e.ctrlKey,
                    alt: e.altKey,
                    shift: e.shiftKey,
                    meta: e.metaKey
                });
            });

            window.addEventListener('keyup', (e) => {
                if (isLockInputFocused()) return;
                state.keysPressed.delete(e.code);
                send({
                    type: 'keyup',
                    keycode: e.keyCode,
                    code: e.code
                });
            });

            // 窗口失焦时释放所有按下的键，避免按键卡死
            window.addEventListener('blur', () => {
                state.keysPressed.forEach(code => {
                    // 发送 keyup 释放所有卡住的按键
                    send({
                        type: 'keyup',
                        keycode: 0,
                        code: code
                    });
                });
                state.keysPressed.clear();
            });

            // 防止右键菜单
            canvas.tabIndex = 0;
            canvas.style.outline = 'none';
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            // ---- 共享剪贴板（无缝双向同步） ----
            // 1) 本地复制 → 远端：拦截画布上的 Ctrl+V，读取浏览器剪贴板并发送到远端，
            //    由服务端写入远端系统剪贴板并注入一次 Ctrl+V 让远端应用粘贴。
            window.addEventListener('paste', (e) => {
                if (state.clip.disabled) return;
                // 原生输入框（文件路径、锁屏密码等）→ 交给浏览器原生粘贴
                const t = e.target;
                if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                if (!state.connected || !state.ws) return;
                e.preventDefault();
                const text = (e.clipboardData || {}).getData('text/plain');
                if (!text) return;
                state.clip.lastLocalSent = text;
                state.clip.remoteText = text;
                send({ type: 'clipboard', text: text });
                showTransferStatus('已粘贴到远端', 1500);
            });

            // 2) 远端复制 → 本地：在下一次用户手势时把远端文本写入本地系统剪贴板
            //    （浏览器要求用户手势授权 clipboard-write，故不能在消息到达时直接写入）
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey || e.altKey) return; // 避免覆盖 Ctrl+V/Ctrl+C 场景
                tryWriteRemoteClipToLocal();
            });
            window.addEventListener('mousedown', () => tryWriteRemoteClipToLocal());
        }

        function getCanvasPos(e) {
            const rect = state.canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * state.scaleX,
                y: (e.clientY - rect.top) * state.scaleY
            };
        }

        // ==================== UI 功能 ====================

            const rect = state.canvas.getBoundingClientRect();
            state.scaleX = state.canvas.width / rect.width;
            state.scaleY = state.canvas.height / rect.height;

        function updateRemoteCursor(x, y) {
            const cursor = document.getElementById('remote-cursor');

            cursor.style.display = 'block';

            const clientX = rect.left + (x * rect.width / state.screenWidth);
            const clientY = rect.top + (y * rect.height / state.screenHeight);

        }

        const QUALITY_MAP = { high: '高', medium: '中', low: '低', verylow: '极低' };

        // 切换到 HTTPS 安全连接：整页跳转（WS 协议随之自适应为 wss://）。
        // 已是 https 时仅刷新高亮状态，不重复跳转。
        function switchToHttps() {
            if (location.protocol === 'https:') return;
            location.href = 'https://' + location.host + location.pathname + location.search;
        }

        // 页面加载后同步“安全连接”按钮状态：https 下标 active 并提示已启用
        function syncSslOption() {
            const btn = document.querySelector('#config-dropdown .dropdown-options[data-key="ssl"] button');
            if (!btn) return;
            const secure = (location.protocol === 'https:');
            btn.classList.toggle('active', secure);
            btn.textContent = secure ? '已启用 HTTPS' : '启用 HTTPS (推荐)';
        }

        function onDropdownClick(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const group = btn.closest('.dropdown-options');
            if (!group) return;
            const key = group.dataset.key;
            const val = btn.dataset.value;

            if (key === 'ssl') {
                // 安全连接：页面级跳转到 HTTPS（服务端 SSL 监听同一端口）。
                // WebSocket 协议由 CONFIG.wsUrl 按 location.protocol 自动适配 wss://
                switchToHttps();
                return;
            }
            if (key === 'quality') {
                const fps = state.currentConfig.fps;
                const jpegQ = val === 'high' ? 80 : val === 'medium' ? 60 : 35;
                state.currentConfig.quality = val;
                send({ type: 'config', quality: val, fps: fps });
            } else if (key === 'fps') {
                const newFps = parseInt(val);
                const quality = state.currentConfig.quality;
                state.currentConfig.fps = newFps;
                send({ type: 'config', quality: quality, fps: newFps });
            } else if (key === 'scale') {
                const newScale = parseInt(val);
                state.currentConfig.scale = newScale;
                send({ type: 'config', scale: newScale });
                buildResolutionOptions();
            } else if (key === 'resolution') {
                const parts = val.split('x');
                const resW = parseInt(parts[0]), resH = parseInt(parts[1]);
                state.currentConfig.resolution = val;
                if (state.screenWidth > 0 && resW <= state.screenWidth) {
                    state.currentConfig.scale = 100;
                    send({ type: 'set_resolution', width: resW, height: resH });
                }
                buildResolutionOptions();
            } else if (key === 'videomode') {
                applyStreamMode(val);
            } else if (key === 'screen') {
                const idx = parseInt(val);
                if (isNaN(idx) || idx < 0) return;
                state.currentConfig.screen = idx;
                send({ type: 'set_output', index: idx });
            } else if (key === 'codec') {
                if (state.displayStreamMode === 'webrtc') {
                    showTransferStatus('WebRTC 模式固定 H.264，请先切换到 FFmpeg 模式', 2500);
                    return;
                }
                if (val !== 'h264' && val !== 'hevc') return;
                state.currentConfig.codec = val;
                try { localStorage.setItem('rd_codec', val); } catch (e) {}
                // 重建解码器等待新协议的关键帧/codec_config；服务端 reinit 后发新流
                state.decoder = new H264Decoder(val);
                send({ type: 'config', codec: val });
            } else if (key === 'hw_encode') {
                if (val !== 'auto' && val !== 'on' && val !== 'off') return;
                state.currentConfig.hw_encode = val;
                try { localStorage.setItem('rd_hwencode', val); } catch (e) {}
                send({ type: 'config', hw_encode: val });
            }
            updateDropdownActive();
            updateQualityLabel();
        }

        // 构建编码协议菜单：按浏览器解码能力探测启用项
        async function buildCodecOptions() {
            const container = document.getElementById('codec-options');
            if (!container) return;
            container.innerHTML = '';
            const defs = [
                { v: 'h264', label: 'H.264', codec: 'avc1.420034' },
                { v: 'hevc', label: 'H.265/HEVC', codec: 'hev1.1.6.L120.90' },
            ];
            for (const d of defs) {
                let ok = true;
                if ('VideoDecoder' in window) {
                    try {
                        const r = await VideoDecoder.isConfigSupported({ codec: d.codec, optimizeForLatency: true });
                        ok = !!r.supported;
                    } catch (e) { ok = false; }
                }
                const btn = document.createElement('button');
                btn.dataset.value = d.v;
                btn.textContent = d.label;
                if (!ok) {
                    btn.disabled = true;
                    btn.style.opacity = '0.4';
                    btn.title = '浏览器不支持该编码解码';
                }
                container.appendChild(btn);
            }
        }

        function buildScreenOptions() {
            const container = document.getElementById('screen-options');
            if (!container) return;
            container.innerHTML = '';
            const note = document.getElementById('screen-note');
            const outs = state.outputs || [];
            if (outs.length <= 1) {
                if (note) note.textContent = outs.length === 1
                    ? '当前: ' + outs[0].name + (outs[0].primary ? ' (主)' : '')
                    : '当前: 主屏';

                    + (o.primary ? ' (主)' : '');

            }
            // 当前输出不在列表时（如 -1），不强制高亮
        }

        function buildResolutionOptions() {
            const container = document.getElementById('resolution-options');
            container.innerHTML = '';
            let resolutions = state.resolutions;
            // 没有从后端获取支持列表时，使用当前屏幕尺寸 + 常用分辨率作为 Fallback
            if (!resolutions || resolutions.length === 0) {
                const sw = state.screenWidth, sh = state.screenHeight;
                if (!sw || !sh) return;
                resolutions = [
                    { width: sw, height: sh },
                    { width: 1920, height: 1080 },
                    { width: 1680, height: 1050 },
                    { width: 1600, height: 900 },
                    { width: 1440, height: 900 },
                    { width: 1366, height: 768 },
                    { width: 1280, height: 720 },
                    { width: 1024, height: 768 },
                ];
            }
            const nativeRes = (state.screenWidth > 0)
                ? state.screenWidth + 'x' + state.screenHeight : '';
            for (const res of resolutions) {
                const w = res.width || res.w;
                const h = res.height || res.h;
                const resolutionStr = w + 'x' + h;
                const btn = document.createElement('button');
                btn.dataset.value = resolutionStr;
                const isNative = (resolutionStr === nativeRes);
                const scalePct = nativeRes ? Math.round(w / state.screenWidth * 100) : 100;
                btn.textContent = (isNative ? '原始 ' : '') + w + '×' + h + ' (' + scalePct + '%)';
                container.appendChild(btn);
            }
        }

        // ==================== 文件传输 ====================
        let currentRemotePath = '/';
        const CHUNK_SIZE = 64 * 1024; // 64KB chunks
        let uploadQueue = [];
        let isUploading = false;

        // 下载缓冲区（分块下载）
        let downloadBuffers = {};
        // 传输监视器状态
        let currentTransferPath = null;
        let currentTransferType = ''; // 'upload' or 'download'

        function toggleFilePanel() {
            const panel = document.getElementById('file-panel');

        // ==================== 共享剪贴板（无缝双向同步） ====================
        function onRemoteClipboard(text) {
            if (!text) return;
            // 忽略自己刚发送的内容（服务端广播回来的回声）
            if (text === state.clip.lastLocalSent) return;
            state.clip.remoteText = text;
            state.clip.pendingLocalWrite = true;
            // 无手势时立即尝试一次（Chrome/Firefox 若已授权可直接写入）
            tryWriteRemoteClipToLocal(true);
            showTransferStatus('已同步远端剪贴板，可直接 Ctrl+V', 2000);
        }

        // 将远端剪贴板文本写入本地系统剪贴板；force 时无视手势要求直接尝试
        function tryWriteRemoteClipToLocal(force) {
            if (!state.clip.pendingLocalWrite || !state.clip.remoteText) return;
            if (state.clip.remoteText === state.clip.lastOsWritten) {
                state.clip.pendingLocalWrite = false;
                return;
            }
            const text = state.clip.remoteText;
            const done = () => {
                state.clip.lastOsWritten = text;
                state.clip.pendingLocalWrite = false;
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackWrite(text, done));
            } else {
                fallbackWrite(text, done);
            }
        }

        // 兜底：http://IP 非安全上下文没有 navigator.clipboard，用隐藏 textarea + execCommand('copy')。
        // execCommand 必须在用户手势内执行才会成功，失败则保持 pending，等下一次手势重试。
        function fallbackWrite(text, done) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.pointerEvents = 'none';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                if (ok) { done(); return; }
            } catch (e) { }
        }

        function navigateTo(path) {
            currentRemotePath = path;
            document.getElementById('file-path-input').value = path;
            send({ type: 'file_list', path: path });
        }

        function refreshFileList() {
            send({ type: 'file_list', path: currentRemotePath });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function parentDir(path) {
            if (path === '/' || path === '') return '/';
            // Remove trailing slashes/backslashes
            let p = path.replace(/[/\\]+$/, '');
            let idx = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
            if (idx <= 0) return '/';
            return p.substring(0, idx);
        }

        function joinPath(parent, name) {
            if (parent === '/' || parent === '') {
                // Windows drive letter like "C:" → no extra separator
                return (name.match(/^[A-Za-z]:$/)) ? name : '/' + name;
            }
            // If parent ends with separator, don't add another
            if (parent.endsWith('/') || parent.endsWith('\\'))
                return parent + name;
            return parent + '/' + name;
        }

        function renderFileList(items) {
            const container = document.getElementById('file-list');
            container.innerHTML = '';
            // Parent dir
            if (currentRemotePath !== '/') {
                const parentPath = parentDir(currentRemotePath);
                const item = document.createElement('div');
                item.className = 'file-item';
                item.onclick = () => navigateTo(parentPath);
                item.innerHTML = '<span class="icon">📂</span><span class="name">..</span><span class="size"></span>';
                container.appendChild(item);
            }
            // Dirs first, then files
            const dirs = items.filter(i => i.isDir).sort((a, b) => a.name.localeCompare(b.name));
            const files = items.filter(i => !i.isDir).sort((a, b) => a.name.localeCompare(b.name));
            for (const item of dirs) {
                const fullPath = joinPath(currentRemotePath, item.name);
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = '<span class="icon">📁</span><span class="name"></span><span class="size"><button class="file-action-btn">⬇</button></span>';
                div.querySelector('.name').textContent = item.name;
                div.querySelector('.name').ondblclick = () => navigateTo(fullPath);
                div.querySelector('.file-action-btn').onclick = (e) => { e.stopPropagation(); downloadFile(item.name); };
                container.appendChild(div);
            }
            for (const item of files) {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.onclick = () => downloadFile(item.name);
                div.innerHTML = '<span class="icon">📄</span><span class="name"></span><span class="size"></span>';
                div.querySelector('.name').textContent = item.name;
                div.querySelector('.size').textContent = formatSize(item.size);
                container.appendChild(div);
            }
        }

        function downloadFile(fileName) {
            const filePath = joinPath(currentRemotePath, fileName);
            send({ type: 'file_download', path: filePath, name: fileName });
        }

        function handleFileUpload(fileList) {
            for (const file of fileList) {
                uploadQueue.push(file);
            }
            document.getElementById('file-upload-input').value = '';
            processUploadQueue();
        }

        function processUploadQueue() {
            if (isUploading || uploadQueue.length === 0) return;
            isUploading = true;
            const file = uploadQueue.shift();
            uploadFileChunked(file);
        }

        async function uploadFileChunked(file) {
            const relativePath = file.webkitRelativePath || file.name;
            const remotePath = joinPath(currentRemotePath, relativePath);
            currentTransferPath = remotePath;
            currentTransferType = 'upload';
            showTransferMonitor('⬆', file.name, 0, file.size, 0);
            showTransferStatus(`上传: ${file.name} (0%)`);

            try {
                // Send start message
                send({ type: 'file_upload_start', path: remotePath, name: file.name, size: file.size });

                let offset = 0;
                while (offset < file.size) {
                    const end = Math.min(offset + CHUNK_SIZE, file.size);
                    const blob = file.slice(offset, end);
                    const buffer = await blob.arrayBuffer();

                    // Build binary packet: [0x10][4-byte path length][path UTF8][4-byte data length][data]
                    const pathBytes = new TextEncoder().encode(remotePath);
                    const header = new ArrayBuffer(9);
                    const view = new DataView(header);
                    view.setUint8(0, 0x10); // file chunk type
                    view.setUint32(1, pathBytes.length, false);
                    view.setUint32(5, buffer.byteLength, false);

                    const packet = new Uint8Array(9 + pathBytes.length + buffer.byteLength);
                    packet.set(new Uint8Array(header), 0);
                    packet.set(pathBytes, 9);
                    packet.set(new Uint8Array(buffer), 9 + pathBytes.length);

                    state.ws.send(packet);
                    offset = end;

                    const pct = Math.round(offset / file.size * 100);
                    showTransferMonitor('⬆', file.name, offset, file.size, 0);
                    showTransferStatus(`上传: ${file.name} (${pct}%)`);

                    // Yield to let WebSocket drain
                    await new Promise(r => setTimeout(r, 10));
                }

                send({ type: 'file_upload_done', path: remotePath, name: file.name });
                showTransferStatus(`上传完成: ${file.name}`, 2000);
                setTimeout(hideTransferMonitor, 500);
            } catch (err) {
                console.error('Upload failed:', err);
                showTransferStatus(`上传失败: ${file.name}`, 3000);
            } finally {
                isUploading = false;
                processUploadQueue();
            }
        }

        function showTransferMonitor(icon, name, transferred, total, speedKBps) {
            const mon = document.getElementById('transfer-monitor');
            document.getElementById('transfer-monitor-icon').textContent = icon;
            document.getElementById('transfer-monitor-name').textContent = name;
            const pct = total > 0 ? Math.round(transferred / total * 100) : 0;
            document.getElementById('transfer-monitor-fill').style.width = pct + '%';
            document.getElementById('transfer-monitor-progress').textContent =
                formatSize(transferred) + ' / ' + formatSize(total) + ' (' + pct + '%)';
            document.getElementById('transfer-monitor-speed').textContent =
                speedKBps > 0 ? speedKBps.toFixed(1) + ' KB/s' : '';
            mon.classList.add('active');
        }

        function hideTransferMonitor() {
            document.getElementById('transfer-monitor').classList.remove('active');
            currentTransferPath = null;
        }

        function cancelCurrentTransfer() {
            // Clear download buffer if exists
            if (currentTransferPath && downloadBuffers[currentTransferPath]) {
                delete downloadBuffers[currentTransferPath];
            }
            hideTransferMonitor();
            showTransferStatus('传输已取消', 2000);
        }

        function showTransferStatus(text, autoHideMs = 0) {
            const el = document.getElementById('transfer-status');
            el.textContent = text;
            el.style.display = 'block';
            if (autoHideMs > 0) {
                setTimeout(() => { el.style.display = 'none'; }, autoHideMs);
            }
        }

        // ==================== 启动 ====================
        window.onload = () => {
            setupInputs();
            connect();
            updateQualityLabel();

            // 窗口大小改变时更新缩放
            window.addEventListener('resize', updateScale);

            // ---- 工具栏固定/自动隐藏（类似 mstsc） ----
            const toolbar = document.getElementById('toolbar');
            const trigger = document.getElementById('toolbar-trigger');
            const pinBtn = document.getElementById('btn-pin');
            let toolbarTimer = null;
            let toolbarPinned = true;
            pinBtn.classList.add('pinned');

            function showToolbar() {
                clearTimeout(toolbarTimer);
                toolbar.classList.remove('hidden');
            }
            function hideToolbar() {
                if (!toolbarPinned)
                    toolbarTimer = setTimeout(() => toolbar.classList.add('hidden'), 600);
            }
            function togglePin() {
                toolbarPinned = !toolbarPinned;
                pinBtn.classList.toggle('pinned', toolbarPinned);
                pinBtn.title = toolbarPinned ? '固定工具栏' : '取消固定';
                if (toolbarPinned) {
                    clearTimeout(toolbarTimer);
                    toolbar.classList.remove('hidden');
                }
            }

            pinBtn.addEventListener('click', togglePin);
            trigger.addEventListener('mouseenter', showToolbar);
            toolbar.addEventListener('mouseenter', () => clearTimeout(toolbarTimer));
            toolbar.addEventListener('mouseleave', hideToolbar);
        };

        // 防止意外关闭
        window.onbeforeunload = () => '确定要断开远程桌面连接吗？';
    </script>
</body>

</html>
