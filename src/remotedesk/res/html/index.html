                fallbackWrite(text, done);
            }
        }

        // 兜底：http://IP 非安全上下文没有 navigator.clipboard，用隐藏 textarea + execCommand('copy')。
        // execCommand 必须在用户手势内执行才会成功，失败则保持 pending，等下一次手势重试。
        function fallbackWrite(text, done) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.pointerEvents = 'none';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                if (ok) { done(); return; }
            } catch (e) { }
        }

        function navigateTo(path) {
            currentRemotePath = path;
            document.getElementById('file-path-input').value = path;
            send({ type: 'file_list', path: path });
        }

        function refreshFileList() {
            send({ type: 'file_list', path: currentRemotePath });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function parentDir(path) {
            if (path === '/' || path === '') return '/';
            // Remove trailing slashes/backslashes
            let p = path.replace(/[/\\]+$/, '');
            let idx = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
            if (idx <= 0) return '/';
            return p.substring(0, idx);
        }

        function joinPath(parent, name) {
            if (parent === '/' || parent === '') {
                // Windows drive letter like "C:" → no extra separator
                return (name.match(/^[A-Za-z]:$/)) ? name : '/' + name;
            }
            // If parent ends with separator, don't add another
            if (parent.endsWith('/') || parent.endsWith('\\'))
                return parent + name;
            return parent + '/' + name;
        }

        function renderFileList(items) {
            const container = document.getElementById('file-list');
            container.innerHTML = '';
            // Parent dir
            if (currentRemotePath !== '/') {
                const parentPath = parentDir(currentRemotePath);
                const item = document.createElement('div');
                item.className = 'file-item';
                item.onclick = () => navigateTo(parentPath);
                item.innerHTML = '<span class="icon">📂</span><span class="name">..</span><span class="size"></span>';
                container.appendChild(item);
            }
            // Dirs first, then files
            const dirs = items.filter(i => i.isDir).sort((a, b) => a.name.localeCompare(b.name));
            const files = items.filter(i => !i.isDir).sort((a, b) => a.name.localeCompare(b.name));
            for (const item of dirs) {
                const fullPath = joinPath(currentRemotePath, item.name);
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = '<span class="icon">📁</span><span class="name"></span><span class="size"><button class="file-action-btn">⬇</button></span>';
                div.querySelector('.name').textContent = item.name;
                div.querySelector('.name').ondblclick = () => navigateTo(fullPath);
                div.querySelector('.file-action-btn').onclick = (e) => { e.stopPropagation(); downloadFile(item.name); };
                container.appendChild(div);
            }
            for (const item of files) {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.onclick = () => downloadFile(item.name);
                div.innerHTML = '<span class="icon">📄</span><span class="name"></span><span class="size"></span>';
                div.querySelector('.name').textContent = item.name;
                div.querySelector('.size').textContent = formatSize(item.size);
                container.appendChild(div);
            }
        }

        function downloadFile(fileName) {
            const filePath = joinPath(currentRemotePath, fileName);
            send({ type: 'file_download', path: filePath, name: fileName });
        }

        function handleFileUpload(fileList) {
            for (const file of fileList) {
                uploadQueue.push(file);
            }
            document.getElementById('file-upload-input').value = '';
            processUploadQueue();
        }

        function processUploadQueue() {
            if (isUploading || uploadQueue.length === 0) return;
            isUploading = true;
            const file = uploadQueue.shift();
            uploadFileChunked(file);
        }

        async function uploadFileChunked(file) {
            const relativePath = file.webkitRelativePath || file.name;
            const remotePath = joinPath(currentRemotePath, relativePath);
            currentTransferPath = remotePath;
            currentTransferType = 'upload';
            showTransferMonitor('⬆', file.name, 0, file.size, 0);
            showTransferStatus(`上传: ${file.name} (0%)`);

            try {
                // Send start message
                send({ type: 'file_upload_start', path: remotePath, name: file.name, size: file.size });

                let offset = 0;
                while (offset < file.size) {
                    const end = Math.min(offset + CHUNK_SIZE, file.size);
                    const blob = file.slice(offset, end);
                    const buffer = await blob.arrayBuffer();

                    // Build binary packet: [0x10][4-byte path length][path UTF8][4-byte data length][data]
                    const pathBytes = new TextEncoder().encode(remotePath);
                    const header = new ArrayBuffer(9);
                    const view = new DataView(header);
                    view.setUint8(0, 0x10); // file chunk type
                    view.setUint32(1, pathBytes.length, false);
                    view.setUint32(5, buffer.byteLength, false);

                    const packet = new Uint8Array(9 + pathBytes.length + buffer.byteLength);
                    packet.set(new Uint8Array(header), 0);
                    packet.set(pathBytes, 9);
                    packet.set(new Uint8Array(buffer), 9 + pathBytes.length);

                    state.ws.send(packet);
                    offset = end;

                    const pct = Math.round(offset / file.size * 100);
                    showTransferMonitor('⬆', file.name, offset, file.size, 0);
                    showTransferStatus(`上传: ${file.name} (${pct}%)`);

                    // Yield to let WebSocket drain
                    await new Promise(r => setTimeout(r, 10));
                }

                send({ type: 'file_upload_done', path: remotePath, name: file.name });
                showTransferStatus(`上传完成: ${file.name}`, 2000);
                setTimeout(hideTransferMonitor, 500);
            } catch (err) {
                console.error('Upload failed:', err);
                showTransferStatus(`上传失败: ${file.name}`, 3000);
            } finally {
                isUploading = false;
                processUploadQueue();
            }
        }

        function showTransferMonitor(icon, name, transferred, total, speedKBps) {
            const mon = document.getElementById('transfer-monitor');
            document.getElementById('transfer-monitor-icon').textContent = icon;
            document.getElementById('transfer-monitor-name').textContent = name;
            const pct = total > 0 ? Math.round(transferred / total * 100) : 0;
            document.getElementById('transfer-monitor-fill').style.width = pct + '%';
            document.getElementById('transfer-monitor-progress').textContent =
                formatSize(transferred) + ' / ' + formatSize(total) + ' (' + pct + '%)';
            document.getElementById('transfer-monitor-speed').textContent =
                speedKBps > 0 ? speedKBps.toFixed(1) + ' KB/s' : '';
            mon.classList.add('active');
        }

        function hideTransferMonitor() {
            document.getElementById('transfer-monitor').classList.remove('active');
            currentTransferPath = null;
        }

        function cancelCurrentTransfer() {
            // Clear download buffer if exists
            if (currentTransferPath && downloadBuffers[currentTransferPath]) {
                delete downloadBuffers[currentTransferPath];
            }
            hideTransferMonitor();
            showTransferStatus('传输已取消', 2000);
        }

        function showTransferStatus(text, autoHideMs = 0) {
            const el = document.getElementById('transfer-status');
            el.textContent = text;
            el.style.display = 'block';
            if (autoHideMs > 0) {
                setTimeout(() => { el.style.display = 'none'; }, autoHideMs);
            }
        }

        // ==================== 启动 ====================
        window.onload = () => {
            setupInputs();
            connect();
            updateQualityLabel();

            // 窗口大小改变时更新缩放
            window.addEventListener('resize', updateScale);

            // ---- 工具栏固定/自动隐藏（类似 mstsc） ----
            const toolbar = document.getElementById('toolbar');
            const trigger = document.getElementById('toolbar-trigger');
            const pinBtn = document.getElementById('btn-pin');
            let toolbarTimer = null;
            let toolbarPinned = true;
            pinBtn.classList.add('pinned');

            function showToolbar() {
                clearTimeout(toolbarTimer);
                toolbar.classList.remove('hidden');
            }
            function hideToolbar() {
                if (!toolbarPinned)
                    toolbarTimer = setTimeout(() => toolbar.classList.add('hidden'), 600);
            }
            function togglePin() {
                toolbarPinned = !toolbarPinned;
                pinBtn.classList.toggle('pinned', toolbarPinned);
                pinBtn.title = toolbarPinned ? '固定工具栏' : '取消固定';
                if (toolbarPinned) {
                    clearTimeout(toolbarTimer);
                    toolbar.classList.remove('hidden');
                }
            }

            pinBtn.addEventListener('click', togglePin);
            trigger.addEventListener('mouseenter', showToolbar);
            toolbar.addEventListener('mouseenter', () => clearTimeout(toolbarTimer));
            toolbar.addEventListener('mouseleave', hideToolbar);
        };

        // 防止意外关闭
        window.onbeforeunload = () => '确定要断开远程桌面连接吗？';
    </script>
</body>

</html>
